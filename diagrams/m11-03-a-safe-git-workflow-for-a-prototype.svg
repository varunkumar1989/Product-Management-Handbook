<svg viewBox="0 0 720 542" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>A safe Git workflow for a prototype</title><defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><rect x="275.0" y="30" width="170.0" height="58" rx="8" class="node"/><text x="360.0" y="56.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">main branch (always</tspan><tspan x="360.0" dy="12">working)</tspan></text><rect x="275.0" y="140" width="170.0" height="58" rx="8" class="node"/><text x="360.0" y="166.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">feature branch:</tspan><tspan x="360.0" dy="12">fee-fallback</tspan></text><rect x="85.0" y="250" width="170.0" height="58" rx="8" class="node"/><text x="170.0" y="283.0" class="small b" text-anchor="middle"><tspan x="170.0" dy="0">Commit 1: fallback text</tspan></text><rect x="275.0" y="250" width="170.0" height="58" rx="8" class="node"/><text x="360.0" y="283.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">Commit 2: retry button</tspan></text><rect x="465.0" y="250" width="170.0" height="58" rx="8" class="node"/><text x="550.0" y="283.0" class="small b" text-anchor="middle"><tspan x="550.0" dy="0">Commit 3: tests pass</tspan></text><rect x="275.0" y="360" width="170.0" height="58" rx="8" class="node"/><text x="360.0" y="386.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">Pull request: description</tspan><tspan x="360.0" dy="12">+ how tested</tspan></text><rect x="275.0" y="470" width="170.0" height="58" rx="8" class="node"/><text x="360.0" y="496.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">Review → merge to main →</tspan><tspan x="360.0" dy="12">deploy test URL</tspan></text><path d="M360.0,88.0 C360.0,112.5 360.0,112.5 360.0,137.0" class="edge" fill="none" marker-end="url(#ah2)"/><text x="364.0" y="115.5" class="tiny mut edge-label" text-anchor="start"><tspan x="364.0" dy="0">git checkout -b</tspan></text><path d="M360.0,198.0 C360.0,222.5 170.0,222.5 170.0,247.0" class="edge" fill="none" marker-end="url(#ah2)"/><line x1="255.0" y1="279.0" x2="272.0" y2="279.0" class="edge" marker-end="url(#ah2)"/><line x1="445.0" y1="279.0" x2="462.0" y2="279.0" class="edge" marker-end="url(#ah2)"/><path d="M550.0,308.0 C550.0,332.5 360.0,332.5 360.0,357.0" class="edge" fill="none" marker-end="url(#ah2)"/><text x="459.0" y="335.5" class="tiny mut edge-label" text-anchor="start"><tspan x="459.0" dy="0">git push</tspan></text><path d="M360.0,418.0 C360.0,442.5 360.0,442.5 360.0,467.0" class="edge" fill="none" marker-end="url(#ah2)"/></svg>