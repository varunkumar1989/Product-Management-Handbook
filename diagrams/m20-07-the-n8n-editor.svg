<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>The n8n editor</title><rect x="6" y="6" width="708" height="228" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">n8n</tspan></text><rect x="210.0" y="11" width="300" height="17" rx="8" class="wf-bar"/><text x="360.0" y="23" class="tiny mut" text-anchor="middle"><tspan x="360.0" dy="0">localhost:5678/workflow/email-triage</tspan></text><rect x="12" y="38" width="150" height="190" rx="8" class="wf-bar" fill-opacity=".6"/><rect x="516" y="38" width="190" height="190" rx="8" class="wf-bar" fill-opacity=".45"/><text x="28" y="49" class="tiny" text-anchor="start"><tspan x="28" dy="0">Overview</tspan></text><rect x="20" y="59" width="138" height="20" rx="5" fill="var(--c1)" fill-opacity=".16"/><text x="28" y="73" class="tiny b" text-anchor="start"><tspan x="28" dy="0">Workflows</tspan></text><text x="28" y="97" class="tiny" text-anchor="start"><tspan x="28" dy="0">Credentials</tspan></text><text x="28" y="121" class="tiny" text-anchor="start"><tspan x="28" dy="0">Executions</tspan></text><text x="28" y="145" class="tiny" text-anchor="start"><tspan x="28" dy="0">Templates</tspan></text><line x1="176" y1="72" x2="490" y2="72" class="grid"/><text x="180" y="64" class="tiny" text-anchor="start"><tspan x="180" dy="0">Gmail Trigger · on new email</tspan></text><text x="486" y="64" class="tiny b" text-anchor="end"><tspan x="486" dy="0">→</tspan></text><circle cx="492" cy="58" r="9" fill="var(--c3)"/><text x="492" y="62" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">1</tspan></text><line x1="176" y1="100" x2="490" y2="100" class="grid"/><text x="180" y="92" class="tiny" text-anchor="start"><tspan x="180" dy="0">AI Agent · Anthropic chat model</tspan></text><text x="486" y="92" class="tiny b" text-anchor="end"><tspan x="486" dy="0">→</tspan></text><line x1="176" y1="128" x2="490" y2="128" class="grid"/><text x="180" y="120" class="tiny" text-anchor="start"><tspan x="180" dy="0">Switch · category</tspan></text><text x="486" y="120" class="tiny b" text-anchor="end"><tspan x="486" dy="0">→</tspan></text><line x1="176" y1="156" x2="490" y2="156" class="grid"/><text x="180" y="148" class="tiny" text-anchor="start"><tspan x="180" dy="0">Slack · send message / Sheets · append row</tspan></text><text x="486" y="148" class="tiny b" text-anchor="end"><tspan x="486" dy="0"></tspan></text><rect x="176" y="160" width="115" height="28" rx="7" fill="var(--c1)"/><text x="233.5" y="178" class="tiny b on-fill" text-anchor="middle"><tspan x="233.5" dy="0">Test workflow</tspan></text><circle cx="492" cy="170" r="9" fill="var(--c3)"/><text x="492" y="174" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">2</tspan></text><text x="180" y="212" class="tiny" text-anchor="start"><tspan x="180" dy="0">Active</tspan></text><rect x="456" y="201" width="30" height="16" rx="8" fill="var(--c4)"/><circle cx="478" cy="209" r="6" fill="#fff" stroke="var(--line)"/><circle cx="492" cy="206" r="9" fill="var(--c3)"/><text x="492" y="210" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">3</tspan></text><rect x="524" y="48" width="174" height="26" rx="5" class="wf-bar"/><text x="534" y="65" class="tiny b" text-anchor="start"><tspan x="534" dy="0">Node: Slack</tspan></text><rect x="524" y="82" width="174" height="28" rx="6" class="wf-input"/><text x="534" y="100" class="tiny mut" text-anchor="start"><tspan x="534" dy="0">Channel: #practice-alerts</tspan></text><rect x="524" y="118" width="174" height="28" rx="6" class="wf-input"/><text x="534" y="136" class="tiny mut" text-anchor="start"><tspan x="534" dy="0">Text: {{ $json.output }}</tspan></text><circle cx="700" cy="128" r="9" fill="var(--c3)"/><text x="700" y="132" class="tiny b on-fill" text-anchor="middle"><tspan x="700" dy="0">4</tspan></text><circle cx="24" cy="252" r="9" fill="var(--c3)"/><text x="24" y="256" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="256" class="small" text-anchor="start"><tspan x="40" dy="0">Nodes run left to right. Click + to add a node; pick apps, logic or AI nodes.</tspan></text><circle cx="24" cy="274" r="9" fill="var(--c3)"/><text x="24" y="278" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="278" class="small" text-anchor="start"><tspan x="40" dy="0">Test workflow runs it once. Each node shows its input and output data, which is the best way to debug.</tspan></text><circle cx="24" cy="296" r="9" fill="var(--c3)"/><text x="24" y="300" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="300" class="small" text-anchor="start"><tspan x="40" dy="0">Active turns on the triggers so it runs automatically.</tspan></text><circle cx="24" cy="318" r="9" fill="var(--c3)"/><text x="24" y="322" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">4</tspan></text><text x="40" y="322" class="small" text-anchor="start"><tspan x="40" dy="0">Expressions in {{ }} insert data from earlier nodes. $json is the current item&#x27;s data.</tspan></text></svg>