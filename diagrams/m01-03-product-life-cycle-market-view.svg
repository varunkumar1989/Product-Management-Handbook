<svg viewBox="0 0 720 132" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Product Life Cycle (market view)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><rect x="10.0" y="6" width="152.5" height="92" rx="10" class="node"/><circle cx="26.0" cy="22" r="11" fill="var(--c1)"/><text x="26.0" y="26" class="on-fill b small" text-anchor="middle"><tspan x="26.0" dy="0">1</tspan></text><text x="94.25" y="28" class="b small" text-anchor="middle"><tspan x="94.25" dy="0">Introduction</tspan></text><text x="86.25" y="58" class="mut tiny" text-anchor="middle"><tspan x="86.25" dy="0">Prove value; small base;</tspan><tspan x="86.25" dy="11">high learning, low profit</tspan></text><line x1="165.5" y1="52.0" x2="189.5" y2="52.0" class="edge" marker-end="url(#ah)"/><rect x="192.5" y="6" width="152.5" height="92" rx="10" class="node"/><circle cx="208.5" cy="22" r="11" fill="var(--c1)"/><text x="208.5" y="26" class="on-fill b small" text-anchor="middle"><tspan x="208.5" dy="0">2</tspan></text><text x="276.75" y="28" class="b small" text-anchor="middle"><tspan x="276.75" dy="0">Growth</tspan></text><text x="268.75" y="58" class="mut tiny" text-anchor="middle"><tspan x="268.75" dy="0">Fit found; scale</tspan><tspan x="268.75" dy="11">acquisition and reliability</tspan></text><line x1="348.0" y1="52.0" x2="372.0" y2="52.0" class="edge" marker-end="url(#ah)"/><rect x="375.0" y="6" width="152.5" height="92" rx="10" class="node"/><circle cx="391.0" cy="22" r="11" fill="var(--c1)"/><text x="391.0" y="26" class="on-fill b small" text-anchor="middle"><tspan x="391.0" dy="0">3</tspan></text><text x="459.25" y="28" class="b small" text-anchor="middle"><tspan x="459.25" dy="0">Maturity</tspan></text><text x="451.25" y="58" class="mut tiny" text-anchor="middle"><tspan x="451.25" dy="0">Saturation; defend,</tspan><tspan x="451.25" dy="11">optimise margin, extend</tspan></text><line x1="530.5" y1="52.0" x2="554.5" y2="52.0" class="edge" marker-end="url(#ah)"/><rect x="557.5" y="6" width="152.5" height="92" rx="10" class="node"/><circle cx="573.5" cy="22" r="11" fill="var(--c1)"/><text x="573.5" y="26" class="on-fill b small" text-anchor="middle"><tspan x="573.5" dy="0">4</tspan></text><text x="641.75" y="28" class="b small" text-anchor="middle"><tspan x="641.75" dy="0">Decline</tspan></text><text x="633.75" y="58" class="mut tiny" text-anchor="middle"><tspan x="633.75" dy="0">Demand falls; harvest,</tspan><tspan x="633.75" dy="11">pivot or sunset</tspan></text></svg>