<svg viewBox="0 0 720 366" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>An artifact prototype beside the chat</title><rect x="6" y="6" width="708" height="238" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">Claude</tspan></text><rect x="12" y="38" width="150" height="200" rx="8" class="wf-bar" fill-opacity=".6"/><rect x="516" y="38" width="190" height="200" rx="8" class="wf-bar" fill-opacity=".45"/><text x="28" y="49" class="tiny" text-anchor="start"><tspan x="28" dy="0">Chats</tspan></text><text x="28" y="73" class="tiny" text-anchor="start"><tspan x="28" dy="0">Projects</tspan></text><rect x="20" y="83" width="138" height="20" rx="5" fill="var(--c1)" fill-opacity=".16"/><text x="28" y="97" class="tiny b" text-anchor="start"><tspan x="28" dy="0">Artifacts</tspan></text><rect x="232.5" y="48" width="257.5" height="45" rx="9" fill="var(--c1)" fill-opacity=".14" stroke="var(--c1)"/><text x="240.52000000000004" y="63" class="tiny" text-anchor="start"><tspan x="240.52000000000004" dy="0">Build a clickable mobile prototype of a</tspan><tspan x="240.52000000000004" dy="11">split-bill screen: items list, &#x27;split with&#x27;</tspan><tspan x="240.52000000000004" dy="11">picker, total per person. Sample data only.</tspan></text><rect x="176.0" y="101" width="257.5" height="34" rx="9" class="wf-bar"/><text x="184" y="116" class="tiny" text-anchor="start"><tspan x="184" dy="0">I&#x27;ve built the prototype. Tap a friend to add</tspan><tspan x="184" dy="11">them; totals update.</tspan></text><circle cx="492" cy="111" r="9" fill="var(--c3)"/><text x="492" y="115" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">1</tspan></text><rect x="232.5" y="143" width="257.5" height="34" rx="9" fill="var(--c1)" fill-opacity=".14" stroke="var(--c1)"/><text x="240.52000000000004" y="158" class="tiny" text-anchor="start"><tspan x="240.52000000000004" dy="0">Make the total sticky at the bottom and add a</tspan><tspan x="240.52000000000004" dy="11">&#x27;Request on UPI&#x27; button.</tspan></text><circle cx="492" cy="153" r="9" fill="var(--c3)"/><text x="492" y="157" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">2</tspan></text><rect x="524.0" y="48" width="83.0" height="22" rx="5" fill="var(--c1)"/><text x="565.5" y="63" class="tiny b on-fill" text-anchor="middle"><tspan x="565.5" dy="0">Preview</tspan></text><rect x="611.0" y="48" width="83.0" height="22" rx="5" class="wf-bar"/><text x="652.5" y="63" class="tiny" text-anchor="middle"><tspan x="652.5" dy="0">Code</tspan></text><rect x="524" y="78" width="174" height="56" rx="6" class="wf-img"/><text x="611.0" y="110" class="tiny mut" text-anchor="middle"><tspan x="611.0" dy="0">Live prototype: Split bill</tspan></text><line x1="524" y1="166" x2="698" y2="166" class="grid"/><text x="528" y="158" class="tiny" text-anchor="start"><tspan x="528" dy="0">Paneer tikka</tspan></text><text x="694" y="158" class="tiny b" text-anchor="end"><tspan x="694" dy="0">₹320</tspan></text><line x1="524" y1="194" x2="698" y2="194" class="grid"/><text x="528" y="186" class="tiny" text-anchor="start"><tspan x="528" dy="0">You + Asha</tspan></text><text x="694" y="186" class="tiny b" text-anchor="end"><tspan x="694" dy="0">₹160 each</tspan></text><rect x="524" y="198" width="90" height="28" rx="7" fill="var(--c1)"/><text x="569.0" y="216" class="tiny b on-fill" text-anchor="middle"><tspan x="569.0" dy="0">Publish</tspan></text><circle cx="700" cy="208" r="9" fill="var(--c3)"/><text x="700" y="212" class="tiny b on-fill" text-anchor="middle"><tspan x="700" dy="0">3</tspan></text><circle cx="24" cy="262" r="9" fill="var(--c3)"/><text x="24" y="266" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="266" class="small" text-anchor="start"><tspan x="40" dy="0">Ask for &#x27;sample data only&#x27; and &#x27;mobile-first&#x27;. Claude writes HTML, CSS and JavaScript and shows a live</tspan><tspan x="40" dy="14">preview.</tspan></text><circle cx="24" cy="298" r="9" fill="var(--c3)"/><text x="24" y="302" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="302" class="small" text-anchor="start"><tspan x="40" dy="0">Change it in plain words. Each change creates a new version you can go back to.</tspan></text><circle cx="24" cy="320" r="9" fill="var(--c3)"/><text x="24" y="324" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="324" class="small" text-anchor="start"><tspan x="40" dy="0">Publish gives a link for stakeholders. Check what is public before sharing, and never put real customer</tspan><tspan x="40" dy="14">data in a prototype.</tspan></text></svg>