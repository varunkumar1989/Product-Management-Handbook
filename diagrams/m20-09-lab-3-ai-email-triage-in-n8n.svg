ill="var(--c1)" style="fill:var(--c1)">ACTION</text><text x="380.66666666666663" y="289" class="small b" text-anchor="start"><tspan x="380.66666666666663" dy="0">Gmail: add label</tspan></text><text x="380.66666666666663" y="306" class="tiny mut" text-anchor="start"><tspan x="380.66666666666663" dy="0">Invoices</tspan></text></svg>