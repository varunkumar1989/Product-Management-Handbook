<svg viewBox="0 0 690 416" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>After — fee shown early, with honest fallback</title><rect x="10" y="26" width="190" height="360" rx="22" class="phone"/><text x="105.0" y="16" class="small b" text-anchor="middle"><tspan x="105.0" dy="0">Cart (redesign)</tspan></text><rect x="22" y="52" width="166" height="26" rx="5" class="wf-bar"/><text x="105.0" y="69" class="tiny b" text-anchor="middle"><tspan x="105.0" dy="0">Your cart</tspan></text><line x1="22" y1="112" x2="188" y2="112" class="grid"/><text x="26" y="103" class="tiny" text-anchor="start"><tspan x="26" dy="0">Veg biryani × 1</tspan></text><text x="184" y="103" class="tiny b" text-anchor="end"><tspan x="184" dy="0">₹260</tspan></text><line x1="22" y1="142" x2="188" y2="142" class="grid"/><text x="26" y="133" class="tiny" text-anchor="start"><tspan x="26" dy="0">Raita × 1</tspan></text><text x="184" y="133" class="tiny b" text-anchor="end"><tspan x="184" dy="0">₹60</tspan></text><line x1="22" y1="172" x2="188" y2="172" class="grid"/><text x="26" y="163" class="tiny" text-anchor="start"><tspan x="26" dy="0">Subtotal</tspan></text><text x="184" y="163" class="tiny b" text-anchor="end"><tspan x="184" dy="0">₹320</tspan></text><line x1="22" y1="202" x2="188" y2="202" class="grid"/><text x="26" y="193" class="tiny" text-anchor="start"><tspan x="26" dy="0">Delivery fee (est.)</tspan></text><text x="184" y="193" class="tiny b" text-anchor="end"><tspan x="184" dy="0">₹45</tspan></text><line x1="22" y1="232" x2="188" y2="232" class="grid"/><text x="26" y="223" class="tiny" text-anchor="start"><tspan x="26" dy="0">Platform fee</tspan></text><text x="184" y="223" class="tiny b" text-anchor="end"><tspan x="184" dy="0">₹5</tspan></text><line x1="22" y1="262" x2="188" y2="262" class="grid"/><text x="26" y="253" class="tiny" text-anchor="start"><tspan x="26" dy="0">Taxes (est.)</tspan></text><text x="184" y="253" class="tiny b" text-anchor="end"><tspan x="184" dy="0">₹18</tspan></text><line x1="22" y1="292" x2="188" y2="292" class="grid"/><text x="26" y="283" class="tiny" text-anchor="start"><tspan x="26" dy="0">Estimated total</tspan></text><text x="184" y="283" class="tiny b" text-anchor="end"><tspan x="184" dy="0">₹388</tspan></text><rect x="22" y="296" width="166" height="32" rx="8" fill="var(--c1)"/><text x="105.0" y="317" class="tiny b on-fill" text-anchor="middle"><tspan x="105.0" dy="0">Pay ₹388</tspan></text><circle cx="214" cy="60" r="10" fill="var(--c3)"/><text x="214" y="64" class="tiny b on-fill" text-anchor="middle"><tspan x="214" dy="0">1</tspan></text><text x="230" y="64" class="tiny" text-anchor="start"><tspan x="230" dy="0">Full breakdown</tspan><tspan x="230" dy="11">visible before</tspan><tspan x="230" dy="11">paying.</tspan></text><circle cx="214" cy="122" r="10" fill="var(--c3)"/><text x="214" y="126" class="tiny b on-fill" text-anchor="middle"><tspan x="214" dy="0">2</tspan></text><text x="230" y="126" class="tiny" text-anchor="start"><tspan x="230" dy="0">Labels say &#x27;est.&#x27;</tspan><tspan x="230" dy="11">where numbers can</tspan><tspan x="230" dy="11">change.</tspan></text><circle cx="214" cy="184" r="10" fill="var(--c3)"/><text x="214" y="188" class="tiny b on-fill" text-anchor="middle"><tspan x="214" dy="0">3</tspan></text><text x="230" y="188" class="tiny" text-anchor="start"><tspan x="230" dy="0">Button repeats the</tspan><tspan x="230" dy="11">total — no</tspan><tspan x="230" dy="11">surprises.</tspan></text><rect x="350" y="26" width="190" height="360" rx="22" class="phone"/><text x="445.0" y="16" class="small b" text-anchor="middle"><tspan x="445.0" dy="0">Fee service unavailable</tspan></text><rect x="362" y="52" width="166" height="26" rx="5" class="wf-bar"/><text x="445.0" y="69" class="tiny b" text-anchor="middle"><tspan x="445.0" dy="0">Your cart</tspan></text><line x1="362" y1="112" x2="528" y2="112" class="grid"/><text x="366" y="103" class="tiny" text-anchor="start"><tspan x="366" dy="0">Subtotal</tspan></text><text x="524" y="103" class="tiny b" text-anchor="end"><tspan x="524" dy="0">₹320</tspan></text><line x1="362" y1="142" x2="528" y2="142" class="grid"/><text x="366" y="133" class="tiny" text-anchor="start"><tspan x="366" dy="0">Delivery fee</tspan></text><text x="524" y="133" class="tiny b" text-anchor="end"><tspan x="524" dy="0">Estimate unavailable</tspan></text><rect x="362" y="146" width="166" height="32" rx="6" class="wf-warn"/><text x="445.0" y="166" class="tiny b" text-anchor="middle"><tspan x="445.0" dy="0">Couldn&#x27;t load the fee. Retry?</tspan></text><rect x="362" y="186" width="166" height="32" rx="8" fill="var(--c1)"/><text x="445.0" y="207" class="tiny b on-fill" text-anchor="middle"><tspan x="445.0" dy="0">Retry</tspan></text><circle cx="554" cy="60" r="10" fill="var(--c3)"/><text x="554" y="64" class="tiny b on-fill" text-anchor="middle"><tspan x="554" dy="0">1</tspan></text><text x="570" y="64" class="tiny" text-anchor="start"><tspan x="570" dy="0">Never invent a</tspan><tspan x="570" dy="11">number when the</tspan><tspan x="570" dy="11">estimate fails.</tspan></text><circle cx="554" cy="122" r="10" fill="var(--c3)"/><text x="554" y="126" class="tiny b on-fill" text-anchor="middle"><tspan x="554" dy="0">2</tspan></text><text x="570" y="126" class="tiny" text-anchor="start"><tspan x="570" dy="0">Recovery action is</tspan><tspan x="570" dy="11">visible and</tspan><tspan x="570" dy="11">keyboard-accessible.</tspan></text></svg>