<svg viewBox="0 0 720 351" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>A Make scenario with a router</title><rect x="6" y="6" width="708" height="251" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">Make</tspan></text><rect x="210.0" y="11" width="300" height="17" rx="8" class="wf-bar"/><text x="360.0" y="23" class="tiny mut" text-anchor="middle"><tspan x="360.0" dy="0">make.com/scenarios/lead-router</tspan></text><rect x="516" y="38" width="190" height="213" rx="8" class="wf-bar" fill-opacity=".45"/><text x="30" y="59" class="tiny" text-anchor="start"><tspan x="30" dy="0">Canvas: modules are circles joined by lines; data flows left to right.</tspan></text><circle cx="492" cy="58" r="9" fill="var(--c3)"/><text x="492" y="62" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">1</tspan></text><line x1="26" y1="95" x2="490" y2="95" class="grid"/><text x="30" y="87" class="tiny" text-anchor="start"><tspan x="30" dy="0">Google Forms · Watch responses</tspan></text><text x="486" y="87" class="tiny b" text-anchor="end"><tspan x="486" dy="0">Trigger</tspan></text><line x1="26" y1="123" x2="490" y2="123" class="grid"/><text x="30" y="115" class="tiny" text-anchor="start"><tspan x="30" dy="0">Router</tspan></text><text x="486" y="115" class="tiny b" text-anchor="end"><tspan x="486" dy="0">splits into 2 routes</tspan></text><line x1="26" y1="151" x2="490" y2="151" class="grid"/><text x="30" y="143" class="tiny" text-anchor="start"><tspan x="30" dy="0">Route A (filter: budget &gt; ₹50,000) → Slack #sales-vip</tspan></text><text x="486" y="143" class="tiny b" text-anchor="end"><tspan x="486" dy="0"></tspan></text><line x1="26" y1="179" x2="490" y2="179" class="grid"/><text x="30" y="171" class="tiny" text-anchor="start"><tspan x="30" dy="0">Route B (all others) → Google Sheets add row</tspan></text><text x="486" y="171" class="tiny b" text-anchor="end"><tspan x="486" dy="0"></tspan></text><rect x="26" y="183" width="90" height="28" rx="7" fill="var(--c1)"/><text x="71.0" y="201" class="tiny b on-fill" text-anchor="middle"><tspan x="71.0" dy="0">Run once</tspan></text><circle cx="492" cy="193" r="9" fill="var(--c3)"/><text x="492" y="197" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">2</tspan></text><text x="30" y="235" class="tiny" text-anchor="start"><tspan x="30" dy="0">Scheduling: every 15 minutes</tspan></text><rect x="456" y="224" width="30" height="16" rx="8" fill="var(--c4)"/><circle cx="478" cy="232" r="6" fill="#fff" stroke="var(--line)"/><circle cx="492" cy="229" r="9" fill="var(--c3)"/><text x="492" y="233" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">3</tspan></text><rect x="524" y="48" width="174" height="26" rx="5" class="wf-bar"/><text x="534" y="65" class="tiny b" text-anchor="start"><tspan x="534" dy="0">Module settings</tspan></text><rect x="524" y="82" width="174" height="28" rx="6" class="wf-input"/><text x="534" y="100" class="tiny mut" text-anchor="start"><tspan x="534" dy="0">Map: {{1.email}}, {{1.budget}}</tspan></text><rect x="524" y="118" width="174" height="26" rx="5" class="wf-bar"/><text x="534" y="135" class="tiny b" text-anchor="start"><tspan x="534" dy="0">Operations used: 3 credits</tspan></text><circle cx="24" cy="275" r="9" fill="var(--c3)"/><text x="24" y="279" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="279" class="small" text-anchor="start"><tspan x="40" dy="0">Each module is one app action. Click between modules to add a filter.</tspan></text><circle cx="24" cy="297" r="9" fill="var(--c3)"/><text x="24" y="301" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="301" class="small" text-anchor="start"><tspan x="40" dy="0">Run once with a test response and inspect the bubbles showing data in and out of each module.</tspan></text><circle cx="24" cy="319" r="9" fill="var(--c3)"/><text x="24" y="323" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="323" class="small" text-anchor="start"><tspan x="40" dy="0">Turn on scheduling. On the free plan the shortest interval is 15 minutes.</tspan></text></svg>