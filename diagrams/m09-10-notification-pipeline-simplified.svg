<svg viewBox="0 0 720 432" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Notification pipeline (simplified)</title><defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><rect x="180.0" y="30" width="170.0" height="58" rx="8" class="node"/><text x="265.0" y="63.0" class="small b" text-anchor="middle"><tspan x="265.0" dy="0">Order service</tspan></text><rect x="370.0" y="30" width="170.0" height="58" rx="8" class="node"/><text x="455.0" y="63.0" class="small b" text-anchor="middle"><tspan x="455.0" dy="0">Marketing service</tspan></text><rect x="275.0" y="140" width="170.0" height="58" rx="8" class="node"/><text x="360.0" y="173.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">Event queue</tspan></text><rect x="275.0" y="250" width="170.0" height="58" rx="8" class="node"/><text x="360.0" y="276.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">Notification service</tspan><tspan x="360.0" dy="12">(preferences, caps,</tspan><tspan x="360.0" dy="12">templates)</tspan></text><rect x="85.0" y="360" width="170.0" height="58" rx="8" class="node"/><text x="170.0" y="393.0" class="small b" text-anchor="middle"><tspan x="170.0" dy="0">Push provider</tspan></text><rect x="275.0" y="360" width="170.0" height="58" rx="8" class="node"/><text x="360.0" y="393.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">SMS provider</tspan></text><rect x="465.0" y="360" width="170.0" height="58" rx="8" class="node"/><text x="550.0" y="393.0" class="small b" text-anchor="middle"><tspan x="550.0" dy="0">Email provider</tspan></text><path d="M265.0,88.0 C265.0,112.5 360.0,112.5 360.0,137.0" class="edge" fill="none" marker-end="url(#ah2)"/><text x="316.5" y="115.5" class="tiny mut edge-label" text-anchor="start"><tspan x="316.5" dy="0">OrderDelivered</tspan></text><path d="M455.0,88.0 C455.0,112.5 360.0,112.5 360.0,137.0" class="edge" fill="none" marker-end="url(#ah2)"/><text x="411.5" y="115.5" class="tiny mut edge-label" text-anchor="start"><tspan x="411.5" dy="0">Campaign</tspan></text><path d="M360.0,198.0 C360.0,222.5 360.0,222.5 360.0,247.0" class="edge" fill="none" marker-end="url(#ah2)"/><path d="M360.0,308.0 C360.0,332.5 170.0,332.5 170.0,357.0" class="edge" fill="none" marker-end="url(#ah2)"/><path d="M360.0,308.0 C360.0,332.5 360.0,332.5 360.0,357.0" class="edge" fill="none" marker-end="url(#ah2)"/><path d="M360.0,308.0 C360.0,332.5 550.0,332.5 550.0,357.0" class="edge" fill="none" marker-end="url(#ah2)"/></svg>