<svg viewBox="0 0 720 558" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>AI WhatsApp assistant for a clinic (hypothetical)</title><defs><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><rect x="10.0" y="8" width="149.5" height="102" rx="10" class="node"/><rect x="10.0" y="8" width="7" height="102" rx="3" fill="var(--c4)"/><text x="26.0" y="24" class="tiny b" text-anchor="start" fill="var(--c4)" style="fill:var(--c4)">TRIGGER</text><text x="26.0" y="41" class="small b" text-anchor="start"><tspan x="26.0" dy="0">Customer messages</tspan><tspan x="26.0" dy="13">on WhatsApp</tspan></text><text x="26.0" y="71" class="tiny mut" text-anchor="start"><tspan x="26.0" dy="0">&#x27;Can I move my</tspan><tspan x="26.0" dy="11">appointment to Friday?&#x27;</tspan></text><line x1="161.5" y1="59.0" x2="190.5" y2="59.0" class="edge" marker-end="url(#ahw)"/><rect x="193.5" y="8" width="149.5" height="102" rx="10" class="node"/><rect x="193.5" y="8" width="7" height="102" rx="3" fill="var(--c1)"/><text x="209.5" y="24" class="tiny b" text-anchor="start" fill="var(--c1)" style="fill:var(--c1)">ACTION</text><text x="209.5" y="41" class="small b" text-anchor="start"><tspan x="209.5" dy="0">WhatsApp Cloud API</tspan><tspan x="209.5" dy="13">webhook</tspan></text><text x="209.5" y="71" class="tiny mut" text-anchor="start"><tspan x="209.5" dy="0">Message arrives in n8n</tspan><tspan x="209.5" dy="11">(WhatsApp Trigger)</tspan></text><line x1="345.0" y1="59.0" x2="374.0" y2="59.0" class="edge" marker-end="url(#ahw)"/><rect x="377.0" y="8" width="149.5" height="102" rx="10" class="node"/><rect x="377.0" y="8" width="7" height="102" rx="3" fill="var(--c2)"/><text x="393.0" y="24" class="tiny b" text-anchor="start" fill="var(--c2)" style="fill:var(--c2)">AI STEP</text><text x="393.0" y="41" class="small b" text-anchor="start"><tspan x="393.0" dy="0">AI Agent (Claude)</tspan></text><text x="393.0" y="58" class="tiny mut" text-anchor="start"><tspan x="393.0" dy="0">Instructions, last 10</tspan><tspan x="393.0" dy="11">messages as memory</tspan></text><line x1="528.5" y1="59.0" x2="557.5" y2="59.0" class="edge" marker-end="url(#ahw)"/><rect x="560.5" y="8" width="149.5" height="102" rx="10" class="node"/><rect x="560.5" y="8" width="7" height="102" rx="3" fill="var(--c6)"/><text x="576.5" y="24" class="tiny b" text-anchor="start" fill="var(--c6)" style="fill:var(--c6)">DATA</text><text x="576.5" y="41" class="small b" text-anchor="start"><tspan x="576.5" dy="0">Knowledge base</tspan></text><text x="576.5" y="58" class="tiny mut" text-anchor="start"><tspan x="576.5" dy="0">FAQ, prices, hours</tspan><tspan x="576.5" dy="11">(Sheet or vector store)</tspan></text><line x1="635.2" y1="112" x2="635.2" y2="147" class="edge" marker-end="url(#ahw)"/><rect x="560.5" y="150" width="149.5" height="102" rx="10" class="node"/><rect x="560.5" y="150" width="7" height="102" rx="3" fill="var(--c1)"/><text x="576.5" y="166" class="tiny b" text-anchor="start" fill="var(--c1)" style="fill:var(--c1)">ACTION</text><text x="576.5" y="183" class="small b" text-anchor="start"><tspan x="576.5" dy="0">Tools</tspan></text><text x="576.5" y="200" class="tiny mut" text-anchor="start"><tspan x="576.5" dy="0">find_booking,</tspan><tspan x="576.5" dy="11">reschedule_booking</tspan><tspan x="576.5" dy="11">(Sheets or your app&#x27;s</tspan><tspan x="576.5" dy="11">API)</tspan></text><line x1="558.5" y1="201.0" x2="529.5" y2="201.0" class="edge" marker-end="url(#ahw)"/><rect x="377.0" y="150" width="149.5" height="102" rx="10" class="node"/><rect x="377.0" y="150" width="7" height="102" rx="3" fill="var(--c3)"/><text x="393.0" y="166" class="tiny b" text-anchor="start" fill="var(--c3)" style="fill:var(--c3)">LOGIC</text><text x="393.0" y="183" class="small b" text-anchor="start"><tspan x="393.0" dy="0">Needs a human?</tspan></text><text x="393.0" y="200" class="tiny mut" text-anchor="start"><tspan x="393.0" dy="0">Complaint, medical</tspan><tspan x="393.0" dy="11">question, low confidence</tspan></text><path d="M451.8,254 L451.8,280 L60,280 L60,343.0 L117,343.0" class="edge" fill="none" marker-end="url(#ahw)"/><rect x="14" y="321.0" width="92" height="18" rx="9" fill="var(--c3)" fill-opacity=".18" stroke="var(--c3)"/><text x="60" y="334.0" class="tiny b" text-anchor="middle"><tspan x="60" dy="0">no</tspan></text><rect x="120.0" y="292" width="149.5" height="102" rx="10" class="node"/><rect x="120.0" y="292" width="7" height="102" rx="3" fill="var(--c5)"/><text x="136.0" y="308" class="tiny b" text-anchor="start" fill="var(--c5)" style="fill:var(--c5)">OUTPUT</text><text x="136" y="325" class="small b" text-anchor="start"><tspan x="136" dy="0">Reply on WhatsApp</tspan></text><text x="136" y="342" class="tiny mut" text-anchor="start"><tspan x="136" dy="0">Confirm new time; send</tspan><tspan x="136" dy="11">summary</tspan></text><path d="M451.8,254 L451.8,408 L60,408 L60,471.0 L117,471.0" class="edge" fill="none" marker-end="url(#ahw)"/><rect x="14" y="449.0" width="92" height="18" rx="9" fill="var(--c3)" fill-opacity=".18" stroke="var(--c3)"/><text x="60" y="462.0" class="tiny b" text-anchor="middle"><tspan x="60" dy="0">yes</tspan></text><rect x="120.0" y="420" width="149.5" height="102" rx="10" class="node"/><rect x="120.0" y="420" width="7" height="102" rx="3" fill="var(--c6)"/><text x="136.0" y="436" class="tiny b" text-anchor="start" fill="var(--c6)" style="fill:var(--c6)">HUMAN</text><text x="136" y="453" class="small b" text-anchor="start"><tspan x="136" dy="0">Handoff</tspan></text><text x="136" y="470" class="tiny mut" text-anchor="start"><tspan x="136" dy="0">Slack alert + provider</tspan><tspan x="136" dy="11">inbox; tell customer a</tspan><tspan x="136" dy="11">person will reply</tspan></text></svg>