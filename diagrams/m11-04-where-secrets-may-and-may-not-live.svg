<svg viewBox="0 0 720 322" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Where secrets may and may not live</title><defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><text x="4" y="63.0" class="small b mut" text-anchor="start"><tspan x="4" dy="0">Browser</tspan></text><rect x="321.0" y="30" width="170.0" height="58" rx="8" class="node"/><text x="406.0" y="56.0" class="small b" text-anchor="middle"><tspan x="406.0" dy="0">Your web page (public:</tspan><tspan x="406.0" dy="12">anyone can read the code)</tspan></text><text x="4" y="173.0" class="small b mut" text-anchor="start"><tspan x="4" dy="0">Server</tspan></text><rect x="321.0" y="140" width="170.0" height="58" rx="8" class="node"/><text x="406.0" y="166.0" class="small b" text-anchor="middle"><tspan x="406.0" dy="0">Serverless function</tspan><tspan x="406.0" dy="12">(holds the API key in a</tspan><tspan x="406.0" dy="12">secret store)</tspan></text><text x="4" y="283.0" class="small b mut" text-anchor="start"><tspan x="4" dy="0">Provider</tspan></text><rect x="321.0" y="250" width="170.0" height="58" rx="8" class="node"/><text x="406.0" y="276.0" class="small b" text-anchor="middle"><tspan x="406.0" dy="0">Third-party API (weather,</tspan><tspan x="406.0" dy="12">payments, AI model)</tspan></text><path d="M406.0,88.0 C406.0,112.5 406.0,112.5 406.0,137.0" class="edge" fill="none" marker-end="url(#ah2)"/><text x="410.0" y="115.5" class="tiny mut edge-label" text-anchor="start"><tspan x="410.0" dy="0">request without key</tspan></text><path d="M406.0,198.0 C406.0,222.5 406.0,222.5 406.0,247.0" class="edge" fill="none" marker-end="url(#ah2)"/><text x="410.0" y="225.5" class="tiny mut edge-label" text-anchor="start"><tspan x="410.0" dy="0">request with key</tspan></text></svg>