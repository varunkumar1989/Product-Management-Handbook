<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>TAM → SAM → SOM (hypothetical meal-planning app, annual)</title><circle cx="190" cy="180.0" r="165.0" fill="var(--c1)" fill-opacity="0.16" stroke="var(--c1)" stroke-width="2"/><text x="190" y="39.0" class="b small" text-anchor="middle"><tspan x="190" dy="0">TAM</tspan></text><line x1="305.5" y1="39.0" x2="400" y2="56" class="grid dash"/><text x="410" y="60" class="b" text-anchor="start" style="font-size:17px">₹144 crore</text><text x="410" y="78" class="small mut" text-anchor="start"><tspan x="410" dy="0">All regularly-ordering/cooking smartphone households</tspan><tspan x="410" dy="13">in the city at ₹1,200/year.</tspan></text><circle cx="190" cy="242.7" r="102.3" fill="var(--c2)" fill-opacity="0.30" stroke="var(--c2)" stroke-width="2"/><text x="190" y="164.4" class="b small" text-anchor="middle"><tspan x="190" dy="0">SAM</tspan></text><line x1="261.6" y1="164.4" x2="400" y2="152" class="grid dash"/><text x="410" y="156" class="b" text-anchor="start" style="font-size:17px">₹36 crore</text><text x="410" y="174" class="small mut" text-anchor="start"><tspan x="410" dy="0">Households in the service area and income band that</tspan><tspan x="410" dy="13">fit the offering.</tspan></text><circle cx="190" cy="281.574" r="63.4" fill="var(--c3)" fill-opacity="0.44" stroke="var(--c3)" stroke-width="2"/><text x="190" y="242.148" class="b small" text-anchor="middle"><tspan x="190" dy="0">SOM</tspan></text><line x1="234.4" y1="242.1" x2="400" y2="248" class="grid dash"/><text x="410" y="252" class="b" text-anchor="start" style="font-size:17px">₹1.44 crore</text><text x="410" y="270" class="small mut" text-anchor="start"><tspan x="410" dy="0">12,000 households we can realistically win in year</tspan><tspan x="410" dy="13">one.</tspan></text></svg>