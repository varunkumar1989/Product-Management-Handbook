<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Collaboration growth loop</title><defs><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><path d="M420.7,72.8 Q491.5,87.7 525.0,111.6" class="edge" fill="none" marker-end="url(#ah3)"/><path d="M569.7,199.3 Q564.5,227.6 533.6,257.7" class="edge" fill="none" marker-end="url(#ah3)"/><path d="M434.5,307.7 Q360.0,323.2 289.4,308.6" class="edge" fill="none" marker-end="url(#ah3)"/><path d="M188.8,260.1 Q155.5,227.6 150.9,202.6" class="edge" fill="none" marker-end="url(#ah3)"/><path d="M191.8,113.9 Q228.5,87.7 295.4,73.6" class="edge" fill="none" marker-end="url(#ah3)"/><rect x="285.0" y="37.0" width="150" height="46" rx="10" class="node"/><text x="360.0" y="58.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">User creates a useful</tspan><tspan x="360.0" dy="12">page</tspan></text><rect x="503.7" y="126.8" width="150" height="46" rx="10" class="node"/><text x="578.7429987478853" y="147.82779073125684" class="small b" text-anchor="middle"><tspan x="578.7429987478853" dy="0">Shares / mentions a</tspan><tspan x="578.7429987478853" dy="12">teammate</tspan></text><rect x="420.2" y="272.2" width="150" height="46" rx="10" class="node"/><text x="495.1906080272688" y="293.1722092687432" class="small b" text-anchor="middle"><tspan x="495.1906080272688" dy="0">Teammate joins and</tspan><tspan x="495.1906080272688" dy="12">edits</tspan></text><rect x="149.8" y="272.2" width="150" height="46" rx="10" class="node"/><text x="224.8093919727312" y="293.1722092687432" class="small b" text-anchor="middle"><tspan x="224.8093919727312" dy="0">Team relies on</tspan><tspan x="224.8093919727312" dy="12">workspace</tspan></text><rect x="66.3" y="126.8" width="150" height="46" rx="10" class="node"/><text x="141.25700125211466" y="147.82779073125687" class="small b" text-anchor="middle"><tspan x="141.25700125211466" dy="0">Team creates more</tspan><tspan x="141.25700125211466" dy="12">pages</tspan></text><circle cx="360.0" cy="190.0" r="46" fill="var(--c2)" fill-opacity=".15" stroke="var(--c2)" stroke-width="2"/><text x="360.0" y="188.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">Reinforcing</tspan><tspan x="360.0" dy="12">loop</tspan></text></svg>