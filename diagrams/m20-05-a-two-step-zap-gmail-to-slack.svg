<svg viewBox="0 0 720 422" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>A two-step Zap: Gmail to Slack</title><rect x="6" y="6" width="708" height="300" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">Zapier</tspan></text><rect x="210.0" y="11" width="300" height="17" rx="8" class="wf-bar"/><text x="360.0" y="23" class="tiny mut" text-anchor="middle"><tspan x="360.0" dy="0">zapier.com/editor</tspan></text><rect x="26" y="48" width="666" height="26" rx="5" class="wf-bar"/><text x="36" y="65" class="tiny b" text-anchor="start"><tspan x="36" dy="0">1. Trigger · Gmail · New email matching search</tspan></text><circle cx="694" cy="58" r="9" fill="var(--c3)"/><text x="694" y="62" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">1</tspan></text><rect x="26" y="82" width="666" height="28" rx="6" class="wf-input"/><text x="36" y="100" class="tiny mut" text-anchor="start"><tspan x="36" dy="0">Search string: from:boss@example.com is:important</tspan></text><rect x="26" y="118" width="666" height="26" rx="5" class="wf-bar"/><text x="36" y="135" class="tiny b" text-anchor="start"><tspan x="36" dy="0">2. Action · Slack · Send channel message</tspan></text><circle cx="694" cy="128" r="9" fill="var(--c3)"/><text x="694" y="132" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">2</tspan></text><rect x="26" y="152" width="666" height="28" rx="6" class="wf-input"/><text x="36" y="170" class="tiny mut" text-anchor="start"><tspan x="36" dy="0">Channel: #practice-alerts</tspan></text><rect x="26" y="188" width="666" height="28" rx="6" class="wf-input"/><text x="36" y="206" class="tiny mut" text-anchor="start"><tspan x="36" dy="0">Message: Important email from {{From}}: {{Subject}}</tspan></text><rect x="26" y="224" width="90" height="28" rx="7" fill="var(--c1)"/><text x="71.0" y="242" class="tiny b on-fill" text-anchor="middle"><tspan x="71.0" dy="0">Test step</tspan></text><circle cx="694" cy="234" r="9" fill="var(--c3)"/><text x="694" y="238" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">3</tspan></text><rect x="26" y="260" width="666" height="28" rx="6" fill="var(--c4)" fill-opacity=".14" stroke="var(--c4)"/><text x="36" y="278" class="tiny b" text-anchor="start"><tspan x="36" dy="0">Publish Zap</tspan></text><circle cx="694" cy="270" r="9" fill="var(--c3)"/><text x="694" y="274" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">4</tspan></text><circle cx="24" cy="324" r="9" fill="var(--c3)"/><text x="24" y="328" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="328" class="small" text-anchor="start"><tspan x="40" dy="0">Choose the app and the event that starts the Zap, sign in, and set options.</tspan></text><circle cx="24" cy="346" r="9" fill="var(--c3)"/><text x="24" y="350" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="350" class="small" text-anchor="start"><tspan x="40" dy="0">Map fields from the trigger into the action. The {{…}} pills are data from step 1.</tspan></text><circle cx="24" cy="368" r="9" fill="var(--c3)"/><text x="24" y="372" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="372" class="small" text-anchor="start"><tspan x="40" dy="0">Test each step with real sample data before publishing.</tspan></text><circle cx="24" cy="390" r="9" fill="var(--c3)"/><text x="24" y="394" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">4</tspan></text><text x="40" y="394" class="small" text-anchor="start"><tspan x="40" dy="0">Publish turns it on. Check Zap history for runs and errors.</tspan></text></svg>