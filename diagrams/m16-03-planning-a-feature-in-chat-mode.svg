<svg viewBox="0 0 720 303" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Planning a feature in chat mode</title><rect x="6" y="6" width="708" height="203" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">Lovable · Chat mode</tspan></text><rect x="145.9" y="48" width="546.1" height="34" rx="9" fill="var(--c1)" fill-opacity=".14" stroke="var(--c1)"/><text x="153.88" y="63" class="tiny" text-anchor="start"><tspan x="153.88" dy="0">I want patients to reschedule a booking. Don&#x27;t build yet. What&#x27;s the simplest approach, and what</tspan><tspan x="153.88" dy="11">could go wrong?</tspan></text><circle cx="694" cy="58" r="9" fill="var(--c3)"/><text x="694" y="62" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">1</tspan></text><rect x="26.0" y="90" width="546.1" height="34" rx="9" class="wf-bar"/><text x="34" y="105" class="tiny" text-anchor="start"><tspan x="34" dy="0">Option A: a Reschedule button on My bookings that reopens the date picker… Risks: double</tspan><tspan x="34" dy="11">bookings, time zones…</tspan></text><circle cx="694" cy="100" r="9" fill="var(--c3)"/><text x="694" y="104" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">2</tspan></text><rect x="145.9" y="132" width="546.1" height="23" rx="9" fill="var(--c1)" fill-opacity=".14" stroke="var(--c1)"/><text x="153.88" y="147" class="tiny" text-anchor="start"><tspan x="153.88" dy="0">Go with option A. Prevent double bookings. Build it.</tspan></text><circle cx="694" cy="142" r="9" fill="var(--c3)"/><text x="694" y="146" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">3</tspan></text><rect x="26" y="163" width="666" height="28" rx="6" fill="var(--c4)" fill-opacity=".14" stroke="var(--c4)"/><text x="36" y="181" class="tiny b" text-anchor="start"><tspan x="36" dy="0">Switching to agent mode: building the reschedule flow</tspan></text><circle cx="24" cy="227" r="9" fill="var(--c3)"/><text x="24" y="231" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="231" class="small" text-anchor="start"><tspan x="40" dy="0">Ask for options and risks first. Chat mode doesn&#x27;t change code.</tspan></text><circle cx="24" cy="249" r="9" fill="var(--c3)"/><text x="24" y="253" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="253" class="small" text-anchor="start"><tspan x="40" dy="0">Read the plan. Remove anything you don&#x27;t need.</tspan></text><circle cx="24" cy="271" r="9" fill="var(--c3)"/><text x="24" y="275" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="275" class="small" text-anchor="start"><tspan x="40" dy="0">Approve one clear plan, then let agent mode build it.</tspan></text></svg>