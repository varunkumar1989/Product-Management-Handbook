<svg viewBox="0 0 720 141" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Weekly AI theme digest on Replit</title><defs><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><rect x="10.0" y="8" width="149.5" height="93" rx="10" class="node"/><rect x="10.0" y="8" width="7" height="93" rx="3" fill="var(--c4)"/><text x="26.0" y="24" class="tiny b" text-anchor="start" fill="var(--c4)" style="fill:var(--c4)">TRIGGER</text><text x="26.0" y="41" class="small b" text-anchor="start"><tspan x="26.0" dy="0">Scheduled</tspan><tspan x="26.0" dy="13">deployment</tspan></text><text x="26.0" y="71" class="tiny mut" text-anchor="start"><tspan x="26.0" dy="0">Every Monday 09:00</tspan></text><line x1="161.5" y1="54.5" x2="190.5" y2="54.5" class="edge" marker-end="url(#ahw)"/><rect x="193.5" y="8" width="149.5" height="93" rx="10" class="node"/><rect x="193.5" y="8" width="7" height="93" rx="3" fill="var(--c6)"/><text x="209.5" y="24" class="tiny b" text-anchor="start" fill="var(--c6)" style="fill:var(--c6)">DATA</text><text x="209.5" y="41" class="small b" text-anchor="start"><tspan x="209.5" dy="0">Read last week&#x27;s</tspan><tspan x="209.5" dy="13">feedback</tspan></text><text x="209.5" y="71" class="tiny mut" text-anchor="start"><tspan x="209.5" dy="0">SQL query on the</tspan><tspan x="209.5" dy="11">database</tspan></text><line x1="345.0" y1="54.5" x2="374.0" y2="54.5" class="edge" marker-end="url(#ahw)"/><rect x="377.0" y="8" width="149.5" height="93" rx="10" class="node"/><rect x="377.0" y="8" width="7" height="93" rx="3" fill="var(--c2)"/><text x="393.0" y="24" class="tiny b" text-anchor="start" fill="var(--c2)" style="fill:var(--c2)">AI STEP</text><text x="393.0" y="41" class="small b" text-anchor="start"><tspan x="393.0" dy="0">Claude summarises</tspan><tspan x="393.0" dy="13">themes</tspan></text><text x="393.0" y="71" class="tiny mut" text-anchor="start"><tspan x="393.0" dy="0">API key from Secrets</tspan></text><line x1="528.5" y1="54.5" x2="557.5" y2="54.5" class="edge" marker-end="url(#ahw)"/><rect x="560.5" y="8" width="149.5" height="93" rx="10" class="node"/><rect x="560.5" y="8" width="7" height="93" rx="3" fill="var(--c5)"/><text x="576.5" y="24" class="tiny b" text-anchor="start" fill="var(--c5)" style="fill:var(--c5)">OUTPUT</text><text x="576.5" y="41" class="small b" text-anchor="start"><tspan x="576.5" dy="0">Post to Slack</tspan></text><text x="576.5" y="58" class="tiny mut" text-anchor="start"><tspan x="576.5" dy="0">Incoming webhook URL in</tspan><tspan x="576.5" dy="11">Secrets</tspan></text></svg>