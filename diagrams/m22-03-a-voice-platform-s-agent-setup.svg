<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>A voice platform&#x27;s agent setup</title><rect x="6" y="6" width="708" height="298" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">Voice agent dashboard</tspan></text><rect x="12" y="38" width="150" height="260" rx="8" class="wf-bar" fill-opacity=".6"/><rect x="516" y="38" width="190" height="260" rx="8" class="wf-bar" fill-opacity=".45"/><rect x="20" y="35" width="138" height="20" rx="5" fill="var(--c1)" fill-opacity=".16"/><text x="28" y="49" class="tiny b" text-anchor="start"><tspan x="28" dy="0">Agents</tspan></text><text x="28" y="73" class="tiny" text-anchor="start"><tspan x="28" dy="0">Phone numbers</tspan></text><text x="28" y="97" class="tiny" text-anchor="start"><tspan x="28" dy="0">Tools</tspan></text><text x="28" y="121" class="tiny" text-anchor="start"><tspan x="28" dy="0">Calls &amp; logs</tspan></text><text x="28" y="145" class="tiny" text-anchor="start"><tspan x="28" dy="0">Billing</tspan></text><rect x="176" y="48" width="314" height="26" rx="5" class="wf-bar"/><text x="186" y="65" class="tiny b" text-anchor="start"><tspan x="186" dy="0">Agent: Glow Salon receptionist</tspan></text><rect x="176" y="82" width="314" height="28" rx="6" class="wf-input"/><text x="186" y="100" class="tiny mut" text-anchor="start"><tspan x="186" dy="0">Instructions: You are Ria, the AI receptionist for Glow Salon…</tspan></text><circle cx="492" cy="92" r="9" fill="var(--c3)"/><text x="492" y="96" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">1</tspan></text><line x1="176" y1="142" x2="490" y2="142" class="grid"/><text x="180" y="134" class="tiny" text-anchor="start"><tspan x="180" dy="0">Model</tspan></text><text x="486" y="134" class="tiny b" text-anchor="end"><tspan x="486" dy="0">Claude (or another LLM)</tspan></text><line x1="176" y1="170" x2="490" y2="170" class="grid"/><text x="180" y="162" class="tiny" text-anchor="start"><tspan x="180" dy="0">Voice</tspan></text><text x="486" y="162" class="tiny b" text-anchor="end"><tspan x="486" dy="0">Warm female, Indian English</tspan></text><circle cx="492" cy="156" r="9" fill="var(--c3)"/><text x="492" y="160" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">2</tspan></text><line x1="176" y1="198" x2="490" y2="198" class="grid"/><text x="180" y="190" class="tiny" text-anchor="start"><tspan x="180" dy="0">Transcriber</tspan></text><text x="486" y="190" class="tiny b" text-anchor="end"><tspan x="486" dy="0">Real-time, en-IN + hi-IN</tspan></text><line x1="176" y1="226" x2="490" y2="226" class="grid"/><text x="180" y="218" class="tiny" text-anchor="start"><tspan x="180" dy="0">Tools</tspan></text><text x="486" y="218" class="tiny b" text-anchor="end"><tspan x="486" dy="0">check_availability, book_appointment</tspan></text><circle cx="492" cy="212" r="9" fill="var(--c3)"/><text x="492" y="216" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">3</tspan></text><line x1="176" y1="254" x2="490" y2="254" class="grid"/><text x="180" y="246" class="tiny" text-anchor="start"><tspan x="180" dy="0">Transfer number</tspan></text><text x="486" y="246" class="tiny b" text-anchor="end"><tspan x="486" dy="0">+91 ••• staff line</tspan></text><rect x="176" y="258" width="241" height="28" rx="7" fill="var(--c1)"/><text x="296.5" y="276" class="tiny b on-fill" text-anchor="middle"><tspan x="296.5" dy="0">Talk to agent (test in browser)</tspan></text><circle cx="492" cy="268" r="9" fill="var(--c3)"/><text x="492" y="272" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">4</tspan></text><rect x="524" y="48" width="174" height="26" rx="5" class="wf-bar"/><text x="534" y="65" class="tiny b" text-anchor="start"><tspan x="534" dy="0">First message</tspan></text><text x="528" y="93" class="tiny" text-anchor="start"><tspan x="528" dy="0">Hi, this is Ria, the AI</tspan><tspan x="528" dy="11">assistant for Glow Salon. How</tspan><tspan x="528" dy="11">can I help today?</tspan></text><rect x="524" y="127" width="174" height="26" rx="5" class="wf-bar"/><text x="534" y="144" class="tiny b" text-anchor="start"><tspan x="534" dy="0">Post-call webhook</tspan></text><rect x="524" y="161" width="174" height="28" rx="6" class="wf-input"/><text x="534" y="179" class="tiny mut" text-anchor="start"><tspan x="534" dy="0">https://your-n8n/webhook/call-summary</tspan></text><circle cx="24" cy="322" r="9" fill="var(--c3)"/><text x="24" y="326" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="326" class="small" text-anchor="start"><tspan x="40" dy="0">Instructions are the system prompt: role, scope, tone, rules and when to transfer.</tspan></text><circle cx="24" cy="344" r="9" fill="var(--c3)"/><text x="24" y="348" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="348" class="small" text-anchor="start"><tspan x="40" dy="0">Pick a voice and transcription language your callers use; test with real speakers.</tspan></text><circle cx="24" cy="366" r="9" fill="var(--c3)"/><text x="24" y="370" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="370" class="small" text-anchor="start"><tspan x="40" dy="0">Tools call your n8n webhooks, which read or write Google Calendar, Sheets or your app.</tspan></text><circle cx="24" cy="388" r="9" fill="var(--c3)"/><text x="24" y="392" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">4</tspan></text><text x="40" y="392" class="small" text-anchor="start"><tspan x="40" dy="0">Test in the browser for free before you buy a phone number.</tspan></text></svg>