<svg viewBox="0 0 720 370" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>A first chat in Claude</title><rect x="6" y="6" width="708" height="270" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">Claude</tspan></text><rect x="210.0" y="11" width="300" height="17" rx="8" class="wf-bar"/><text x="360.0" y="23" class="tiny mut" text-anchor="middle"><tspan x="360.0" dy="0">claude.ai/new</tspan></text><rect x="12" y="38" width="150" height="232" rx="8" class="wf-bar" fill-opacity=".6"/><text x="28" y="49" class="tiny" text-anchor="start"><tspan x="28" dy="0">+ New chat</tspan></text><rect x="20" y="59" width="138" height="20" rx="5" fill="var(--c1)" fill-opacity=".16"/><text x="28" y="73" class="tiny b" text-anchor="start"><tspan x="28" dy="0">Chats</tspan></text><text x="28" y="97" class="tiny" text-anchor="start"><tspan x="28" dy="0">Projects</tspan></text><text x="28" y="121" class="tiny" text-anchor="start"><tspan x="28" dy="0">Artifacts</tspan></text><text x="28" y="145" class="tiny" text-anchor="start"><tspan x="28" dy="0">Settings</tspan></text><rect x="176" y="48" width="516" height="26" rx="5" class="wf-bar"/><text x="186" y="65" class="tiny b" text-anchor="start"><tspan x="186" dy="0">Interview synthesis</tspan></text><rect x="268.9" y="82" width="423.1" height="34" rx="9" fill="var(--c1)" fill-opacity=".14" stroke="var(--c1)"/><text x="276.88000000000005" y="97" class="tiny" text-anchor="start"><tspan x="276.88000000000005" dy="0">I&#x27;m a PM at a food-delivery app. Turn the attached notes into the top 5</tspan><tspan x="276.88000000000005" dy="11">problems, with one quote each. Table, max 200 words.</tspan></text><circle cx="694" cy="92" r="9" fill="var(--c3)"/><text x="694" y="96" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">1</tspan></text><rect x="176" y="124" width="516" height="56" rx="6" class="wf-img"/><text x="434.0" y="156" class="tiny mut" text-anchor="middle"><tspan x="434.0" dy="0">interview-notes.pdf (attached)</tspan></text><rect x="176.0" y="188" width="423.1" height="34" rx="9" class="wf-bar"/><text x="184" y="203" class="tiny" text-anchor="start"><tspan x="184" dy="0">Here are the five problems… (table with Problem, Evidence, Quote, How many</tspan><tspan x="184" dy="11">users)</tspan></text><circle cx="694" cy="198" r="9" fill="var(--c3)"/><text x="694" y="202" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">2</tspan></text><rect x="176" y="230" width="516" height="28" rx="6" class="wf-input"/><text x="186" y="248" class="tiny mut" text-anchor="start"><tspan x="186" dy="0">Reply… e.g. &#x27;Now rank them by frequency and add a confidence column&#x27;</tspan></text><circle cx="694" cy="240" r="9" fill="var(--c3)"/><text x="694" y="244" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">3</tspan></text><circle cx="24" cy="294" r="9" fill="var(--c3)"/><text x="24" y="298" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="298" class="small" text-anchor="start"><tspan x="40" dy="0">Write the four parts: context, task, input, format. Attach files with the paperclip or drag and drop.</tspan></text><circle cx="24" cy="316" r="9" fill="var(--c3)"/><text x="24" y="320" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="320" class="small" text-anchor="start"><tspan x="40" dy="0">Read the answer critically. Check quotes against the source, because AI can misquote.</tspan></text><circle cx="24" cy="338" r="9" fill="var(--c3)"/><text x="24" y="342" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="342" class="small" text-anchor="start"><tspan x="40" dy="0">Improve by replying, not by starting again: ask for a change, a different format, or a shorter version.</tspan></text></svg>