<svg viewBox="0 0 720 160" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Checkout loses the most users at the payment step (hypothetical)</title><text x="180" y="28" class="small" text-anchor="end"><tspan x="180" dy="0">Cart → Checkout start</tspan></text><rect x="190" y="14" width="276.0" height="22" rx="4" fill="var(--c1)"/><text x="474.0" y="29" class="small b" text-anchor="start"><tspan x="474.0" dy="0">30%</tspan></text><text x="180" y="62" class="small" text-anchor="end"><tspan x="180" dy="0">Checkout start → Address</tspan></text><rect x="190" y="48" width="73.6" height="22" rx="4" fill="var(--c1)"/><text x="271.6" y="63" class="small b" text-anchor="start"><tspan x="271.6" dy="0">8%</tspan></text><text x="180" y="96" class="small" text-anchor="end"><tspan x="180" dy="0">Address → Payment step</tspan></text><rect x="190" y="82" width="55.2" height="22" rx="4" fill="var(--c1)"/><text x="253.2" y="97" class="small b" text-anchor="start"><tspan x="253.2" dy="0">6%</tspan></text><text x="180" y="130" class="small" text-anchor="end"><tspan x="180" dy="0">Payment step → Order placed</tspan></text><rect x="190" y="116" width="276.0" height="22" rx="4" fill="var(--c3)"/><text x="474.0" y="131" class="small b" text-anchor="start"><tspan x="474.0" dy="0">30%</tspan></text></svg>