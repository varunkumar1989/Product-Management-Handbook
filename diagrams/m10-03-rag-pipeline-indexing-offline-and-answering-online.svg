<svg viewBox="0 0 720 542" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>RAG pipeline — indexing (offline) and answering (online)</title><defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><text x="4" y="63.0" class="small b mut" text-anchor="start"><tspan x="4" dy="0">Indexing</tspan></text><rect x="130.0" y="30" width="123.0" height="58" rx="8" class="node"/><text x="191.5" y="56.0" class="small b" text-anchor="middle"><tspan x="191.5" dy="0">Approved sources</tspan><tspan x="191.5" dy="12">(policies, FAQs)</tspan></text><rect x="273.0" y="30" width="123.0" height="58" rx="8" class="node"/><text x="334.5" y="56.0" class="small b" text-anchor="middle"><tspan x="334.5" dy="0">Clean + split into</tspan><tspan x="334.5" dy="12">chunks</tspan></text><rect x="416.0" y="30" width="123.0" height="58" rx="8" class="node"/><text x="477.5" y="63.0" class="small b" text-anchor="middle"><tspan x="477.5" dy="0">Embed chunks</tspan></text><rect x="559.0" y="30" width="123.0" height="58" rx="8" class="node"/><text x="620.5" y="56.0" class="small b" text-anchor="middle"><tspan x="620.5" dy="0">Vector / hybrid</tspan><tspan x="620.5" dy="12">index (+ metadata,</tspan><tspan x="620.5" dy="12">permissions)</tspan></text><rect x="321.0" y="140" width="170.0" height="58" rx="8" class="node"/><text x="406.0" y="173.0" class="small b" text-anchor="middle"><tspan x="406.0" dy="0">Refresh on change</tspan></text><text x="4" y="283.0" class="small b mut" text-anchor="start"><tspan x="4" dy="0">Answering</tspan></text><rect x="131.0" y="250" width="170.0" height="58" rx="8" class="node"/><text x="216.0" y="283.0" class="small b" text-anchor="middle"><tspan x="216.0" dy="0">User question</tspan></text><rect x="321.0" y="250" width="170.0" height="58" rx="8" class="node"/><text x="406.0" y="276.0" class="small b" text-anchor="middle"><tspan x="406.0" dy="0">Embed query + filter by</tspan><tspan x="406.0" dy="12">user permissions</tspan></text><rect x="511.0" y="250" width="170.0" height="58" rx="8" class="node"/><text x="596.0" y="283.0" class="small b" text-anchor="middle"><tspan x="596.0" dy="0">Retrieve top-k (+ rerank)</tspan></text><rect x="321.0" y="360" width="170.0" height="58" rx="8" class="node"/><text x="406.0" y="386.0" class="small b" text-anchor="middle"><tspan x="406.0" dy="0">Prompt: instructions +</tspan><tspan x="406.0" dy="12">question + retrieved</tspan><tspan x="406.0" dy="12">chunks</tspan></text><rect x="321.0" y="470" width="170.0" height="58" rx="8" class="node"/><text x="406.0" y="496.0" class="small b" text-anchor="middle"><tspan x="406.0" dy="0">LLM answer with</tspan><tspan x="406.0" dy="12">citations, or &#x27;not found&#x27;</tspan><tspan x="406.0" dy="12">+ escalate</tspan></text><line x1="253.0" y1="59.0" x2="270.0" y2="59.0" class="edge" marker-end="url(#ah2)"/><line x1="396.0" y1="59.0" x2="413.0" y2="59.0" class="edge" marker-end="url(#ah2)"/><line x1="539.0" y1="59.0" x2="556.0" y2="59.0" class="edge" marker-end="url(#ah2)"/><path d="M191.5,88.0 C191.5,112.5 406.0,112.5 406.0,137.0" class="edge" fill="none" marker-end="url(#ah2)"/><path d="M620.5,88.0 C620.5,167.5 596.0,167.5 596.0,247.0" class="edge" fill="none" marker-end="url(#ah2)"/><text x="612.25" y="170.5" class="tiny mut edge-label" text-anchor="start"><tspan x="612.25" dy="0">search</tspan></text><line x1="301.0" y1="279.0" x2="318.0" y2="279.0" class="edge" marker-end="url(#ah2)"/><line x1="491.0" y1="279.0" x2="508.0" y2="279.0" class="edge" marker-end="url(#ah2)"/><path d="M596.0,308.0 C596.0,332.5 406.0,332.5 406.0,357.0" class="edge" fill="none" marker-end="url(#ah2)"/><path d="M406.0,418.0 C406.0,442.5 406.0,442.5 406.0,467.0" class="edge" fill="none" marker-end="url(#ah2)"/></svg>