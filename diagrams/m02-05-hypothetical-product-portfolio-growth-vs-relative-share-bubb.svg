<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Hypothetical product portfolio — growth vs relative share (bubble = revenue)</title><rect x="70" y="20" width="630" height="324" class="plot"/><line x1="385.0" y1="20" x2="385.0" y2="344" class="grid dash"/><line x1="70" y1="182.0" x2="700" y2="182.0" class="grid dash"/><text x="78" y="36" class="quad" text-anchor="start"><tspan x="78" dy="0">Question marks</tspan></text><text x="692" y="36" class="quad" text-anchor="end"><tspan x="692" dy="0">Stars</tspan></text><text x="78" y="336" class="quad" text-anchor="start"><tspan x="78" dy="0">Dogs</tspan></text><text x="692" y="336" class="quad" text-anchor="end"><tspan x="692" dy="0">Cash cows</tspan></text><circle cx="574.0" cy="266.2" r="24" fill="var(--c1)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"/><text x="546.0" y="270.24" class="small" text-anchor="end"><tspan x="546.0" dy="0">Core app</tspan></text><circle cx="353.5" cy="110.7" r="14" fill="var(--c2)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"/><text x="371.5" y="114.72" class="small" text-anchor="start"><tspan x="371.5" dy="0">Subscription</tspan></text><circle cx="227.5" cy="58.9" r="11" fill="var(--c3)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"/><text x="242.5" y="62.879999999999995" class="small" text-anchor="start"><tspan x="242.5" dy="0">Grocery delivery</tspan></text><circle cx="164.5" cy="305.1" r="7" fill="var(--c4)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"/><text x="175.5" y="309.12" class="small" text-anchor="start"><tspan x="175.5" dy="0">Legacy loyalty</tspan></text><line x1="70" y1="344" x2="700" y2="344" class="axis"/><line x1="70" y1="20" x2="70" y2="344" class="axis"/><text x="385.0" y="388" class="small b mut" text-anchor="middle"><tspan x="385.0" dy="0">Relative market share (1.0 = leader)</tspan></text><text x="16" y="182.0" class="small b mut" text-anchor="middle" transform="rotate(-90 16 182.0)">Market growth (%/yr)</text><circle cx="75" cy="370" r="5" fill="var(--c1)"/><text x="84" y="374" class="small" text-anchor="start"><tspan x="84" dy="0">Cash cow</tspan></text><circle cx="157.0" cy="370" r="5" fill="var(--c2)"/><text x="166.0" y="374" class="small" text-anchor="start"><tspan x="166.0" dy="0">Star</tspan></text><circle cx="213.0" cy="370" r="5" fill="var(--c3)"/><text x="222.0" y="374" class="small" text-anchor="start"><tspan x="222.0" dy="0">Question mark</tspan></text><circle cx="327.5" cy="370" r="5" fill="var(--c4)"/><text x="336.5" y="374" class="small" text-anchor="start"><tspan x="336.5" dy="0">Dog</tspan></text></svg>