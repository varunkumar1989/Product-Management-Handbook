<svg viewBox="0 0 720 308" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>A Notion roadmap database (board view)</title><rect x="6" y="6" width="708" height="230" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">Notion</tspan></text><rect x="210.0" y="11" width="300" height="17" rx="8" class="wf-bar"/><text x="360.0" y="23" class="tiny mut" text-anchor="middle"><tspan x="360.0" dy="0">notion.so/product-hub/roadmap</tspan></text><rect x="12" y="38" width="150" height="192" rx="8" class="wf-bar" fill-opacity=".6"/><rect x="516" y="38" width="190" height="192" rx="8" class="wf-bar" fill-opacity=".45"/><text x="28" y="49" class="tiny" text-anchor="start"><tspan x="28" dy="0">Product hub</tspan></text><rect x="20" y="59" width="138" height="20" rx="5" fill="var(--c1)" fill-opacity=".16"/><text x="28" y="73" class="tiny b" text-anchor="start"><tspan x="28" dy="0">Roadmap</tspan></text><text x="28" y="97" class="tiny" text-anchor="start"><tspan x="28" dy="0">PRDs</tspan></text><text x="28" y="121" class="tiny" text-anchor="start"><tspan x="28" dy="0">Research</tspan></text><text x="28" y="145" class="tiny" text-anchor="start"><tspan x="28" dy="0">Decisions</tspan></text><text x="28" y="169" class="tiny" text-anchor="start"><tspan x="28" dy="0">Meeting notes</tspan></text><rect x="176.0" y="48" width="74.5" height="22" rx="5" fill="var(--c1)"/><text x="213.25" y="63" class="tiny b on-fill" text-anchor="middle"><tspan x="213.25" dy="0">Board</tspan></text><rect x="254.5" y="48" width="74.5" height="22" rx="5" class="wf-bar"/><text x="291.75" y="63" class="tiny" text-anchor="middle"><tspan x="291.75" dy="0">Table</tspan></text><rect x="333.0" y="48" width="74.5" height="22" rx="5" class="wf-bar"/><text x="370.25" y="63" class="tiny" text-anchor="middle"><tspan x="370.25" dy="0">Timeline</tspan></text><rect x="411.5" y="48" width="74.5" height="22" rx="5" class="wf-bar"/><text x="448.75" y="63" class="tiny" text-anchor="middle"><tspan x="448.75" dy="0">Calendar</tspan></text><line x1="176" y1="102" x2="490" y2="102" class="grid"/><text x="180" y="94" class="tiny" text-anchor="start"><tspan x="180" dy="0">Now · Split payments (RICE 42)</tspan></text><text x="486" y="94" class="tiny b" text-anchor="end"><tspan x="486" dy="0">Asha</tspan></text><line x1="176" y1="130" x2="490" y2="130" class="grid"/><text x="180" y="122" class="tiny" text-anchor="start"><tspan x="180" dy="0">Now · Saved addresses (RICE 35)</tspan></text><text x="486" y="122" class="tiny b" text-anchor="end"><tspan x="486" dy="0">Ravi</tspan></text><line x1="176" y1="158" x2="490" y2="158" class="grid"/><text x="180" y="150" class="tiny" text-anchor="start"><tspan x="180" dy="0">Next · Loyalty points (RICE 28)</tspan></text><text x="486" y="150" class="tiny b" text-anchor="end"><tspan x="486" dy="0">Meena</tspan></text><line x1="176" y1="186" x2="490" y2="186" class="grid"/><text x="180" y="178" class="tiny" text-anchor="start"><tspan x="180" dy="0">Later · Group ordering (RICE 19)</tspan></text><text x="486" y="178" class="tiny b" text-anchor="end"><tspan x="486" dy="0">—</tspan></text><rect x="176" y="190" width="90" height="28" rx="7" fill="var(--c1)"/><text x="221.0" y="208" class="tiny b on-fill" text-anchor="middle"><tspan x="221.0" dy="0">+ New</tspan></text><circle cx="492" cy="200" r="9" fill="var(--c3)"/><text x="492" y="204" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">1</tspan></text><rect x="524" y="48" width="174" height="26" rx="5" class="wf-bar"/><text x="534" y="65" class="tiny b" text-anchor="start"><tspan x="534" dy="0">Properties</tspan></text><circle cx="700" cy="58" r="9" fill="var(--c3)"/><text x="700" y="62" class="tiny b on-fill" text-anchor="middle"><tspan x="700" dy="0">2</tspan></text><line x1="524" y1="106" x2="698" y2="106" class="grid"/><text x="528" y="98" class="tiny" text-anchor="start"><tspan x="528" dy="0">Status</tspan></text><text x="694" y="98" class="tiny b" text-anchor="end"><tspan x="694" dy="0">Now</tspan></text><line x1="524" y1="134" x2="698" y2="134" class="grid"/><text x="528" y="126" class="tiny" text-anchor="start"><tspan x="528" dy="0">Quarter</tspan></text><text x="694" y="126" class="tiny b" text-anchor="end"><tspan x="694" dy="0">Q4 2026</tspan></text><line x1="524" y1="162" x2="698" y2="162" class="grid"/><text x="528" y="154" class="tiny" text-anchor="start"><tspan x="528" dy="0">Owner</tspan></text><text x="694" y="154" class="tiny b" text-anchor="end"><tspan x="694" dy="0">Asha</tspan></text><line x1="524" y1="190" x2="698" y2="190" class="grid"/><text x="528" y="182" class="tiny" text-anchor="start"><tspan x="528" dy="0">RICE score</tspan></text><text x="694" y="182" class="tiny b" text-anchor="end"><tspan x="694" dy="0">42</tspan></text><line x1="524" y1="218" x2="698" y2="218" class="grid"/><text x="528" y="210" class="tiny" text-anchor="start"><tspan x="528" dy="0">PRD</tspan></text><text x="694" y="210" class="tiny b" text-anchor="end"><tspan x="694" dy="0">↗ Split payments PRD</tspan></text><circle cx="24" cy="254" r="9" fill="var(--c3)"/><text x="24" y="258" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="258" class="small" text-anchor="start"><tspan x="40" dy="0">Each card is a page. Click + New and choose a template so every item starts with the same structure.</tspan></text><circle cx="24" cy="276" r="9" fill="var(--c3)"/><text x="24" y="280" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="280" class="small" text-anchor="start"><tspan x="40" dy="0">Properties hold the data you filter and sort by. &#x27;PRD&#x27; is a relation that links to the PRDs database.</tspan></text></svg>