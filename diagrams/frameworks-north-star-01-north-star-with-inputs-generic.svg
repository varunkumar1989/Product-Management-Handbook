<svg viewBox="0 0 720 276" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>North Star with inputs (generic)</title><path d="M338.0,134.0 C352.0,134.0 354.0,38.0 368.0,38.0" class="edge" fill="none"/><rect x="368.0" y="12.0" width="330.0" height="52" rx="8" class="node"/><text x="533.0" y="42" class="small" text-anchor="middle"><tspan x="533.0" dy="0">Breadth: how many users get value</tspan></text><path d="M338.0,134.0 C352.0,134.0 354.0,102.0 368.0,102.0" class="edge" fill="none"/><rect x="368.0" y="76.0" width="330.0" height="52" rx="8" class="node"/><text x="533.0" y="106" class="small" text-anchor="middle"><tspan x="533.0" dy="0">Depth: how much value each gets</tspan></text><path d="M338.0,134.0 C352.0,134.0 354.0,166.0 368.0,166.0" class="edge" fill="none"/><rect x="368.0" y="140.0" width="330.0" height="52" rx="8" class="node"/><text x="533.0" y="170" class="small" text-anchor="middle"><tspan x="533.0" dy="0">Frequency: how often</tspan></text><path d="M338.0,134.0 C352.0,134.0 354.0,230.0 368.0,230.0" class="edge" fill="none"/><rect x="368.0" y="204.0" width="330.0" height="52" rx="8" class="node"/><text x="533.0" y="234" class="small" text-anchor="middle"><tspan x="533.0" dy="0">Efficiency / quality: how well</tspan></text><rect x="8.0" y="108.0" width="330.0" height="52" rx="8" class="node hl"/><text x="173.0" y="138.0" class="small b" text-anchor="middle"><tspan x="173.0" dy="0">North Star: recurring value delivered</tspan></text></svg>