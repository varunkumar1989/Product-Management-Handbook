<svg viewBox="0 0 720 439" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>A first Claude Code session in the terminal</title><rect x="6" y="6" width="708" height="303" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">Terminal — first-project</tspan></text><rect x="26" y="48" width="666" height="36" rx="6" fill="var(--ink)" fill-opacity=".9"/><text x="34" y="64" class="tiny on-fill" text-anchor="start" style="font-family:ui-monospace,Consolas,monospace">$ cd ~/AI-Tools-Lab/first-project</text><text x="34" y="76" class="tiny on-fill" text-anchor="start" style="font-family:ui-monospace,Consolas,monospace">$ claude</text><rect x="145.9" y="92" width="546.1" height="34" rx="9" fill="var(--c1)" fill-opacity=".14" stroke="var(--c1)"/><text x="153.88" y="107" class="tiny" text-anchor="start"><tspan x="153.88" dy="0">Create a one-page landing page for a &#x27;Split Bill&#x27; feature: headline, three benefits, a waitlist</tspan><tspan x="153.88" dy="11">form. Mobile-first. Plain HTML/CSS/JS.</tspan></text><circle cx="694" cy="102" r="9" fill="var(--c3)"/><text x="694" y="106" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">1</tspan></text><rect x="26.0" y="134" width="546.1" height="34" rx="9" class="wf-bar"/><text x="34" y="149" class="tiny" text-anchor="start"><tspan x="34" dy="0">Plan: create index.html, style.css, app.js. Write index.html? (Yes / Yes, and don&#x27;t ask again /</tspan><tspan x="34" dy="11">No)</tspan></text><circle cx="694" cy="144" r="9" fill="var(--c3)"/><text x="694" y="148" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">2</tspan></text><rect x="26" y="176" width="666" height="48" rx="6" fill="var(--ink)" fill-opacity=".9"/><text x="34" y="192" class="tiny on-fill" text-anchor="start" style="font-family:ui-monospace,Consolas,monospace">+ index.html  (62 lines)</text><text x="34" y="204" class="tiny on-fill" text-anchor="start" style="font-family:ui-monospace,Consolas,monospace">+ style.css   (48 lines)</text><text x="34" y="216" class="tiny on-fill" text-anchor="start" style="font-family:ui-monospace,Consolas,monospace">+ app.js      (21 lines)</text><rect x="145.9" y="232" width="546.1" height="23" rx="9" fill="var(--c1)" fill-opacity=".14" stroke="var(--c1)"/><text x="153.88" y="247" class="tiny" text-anchor="start"><tspan x="153.88" dy="0">Open it in my browser, then make the button colour match #2563EB.</tspan></text><circle cx="694" cy="242" r="9" fill="var(--c3)"/><text x="694" y="246" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">3</tspan></text><rect x="26" y="263" width="666" height="28" rx="6" fill="var(--c4)" fill-opacity=".14" stroke="var(--c4)"/><text x="36" y="281" class="tiny b" text-anchor="start"><tspan x="36" dy="0">Done. Changes shown as a diff. Ask: &#x27;commit this with a clear message&#x27;.</tspan></text><circle cx="694" cy="273" r="9" fill="var(--c3)"/><text x="694" y="277" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">4</tspan></text><circle cx="24" cy="327" r="9" fill="var(--c3)"/><text x="24" y="331" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="331" class="small" text-anchor="start"><tspan x="40" dy="0">Describe the outcome, the constraints (mobile-first, plain HTML) and any data rules (sample data only).</tspan></text><circle cx="24" cy="349" r="9" fill="var(--c3)"/><text x="24" y="353" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="353" class="small" text-anchor="start"><tspan x="40" dy="0">Claude asks before writing files or running commands. Read the request, then approve once, or approve</tspan><tspan x="40" dy="14">for the session.</tspan></text><circle cx="24" cy="385" r="9" fill="var(--c3)"/><text x="24" y="389" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="389" class="small" text-anchor="start"><tspan x="40" dy="0">Iterate in small steps. One change per message is easiest to check.</tspan></text><circle cx="24" cy="407" r="9" fill="var(--c3)"/><text x="24" y="411" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">4</tspan></text><text x="40" y="411" class="small" text-anchor="start"><tspan x="40" dy="0">Review the diff, then ask Claude to commit. Small commits make mistakes cheap to undo.</tspan></text></svg>