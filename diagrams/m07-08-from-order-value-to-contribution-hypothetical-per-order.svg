<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>From order value to contribution (hypothetical ₹ per order)</title><line x1="64" y1="270.0" x2="700" y2="270.0" class="grid"/><text x="56" y="274.0" class="mut small" text-anchor="end"><tspan x="56" dy="0">₹0</tspan></text><line x1="64" y1="207.5" x2="700" y2="207.5" class="grid"/><text x="56" y="211.5" class="mut small" text-anchor="end"><tspan x="56" dy="0">₹50</tspan></text><line x1="64" y1="145.0" x2="700" y2="145.0" class="grid"/><text x="56" y="149.0" class="mut small" text-anchor="end"><tspan x="56" dy="0">₹100</tspan></text><line x1="64" y1="82.5" x2="700" y2="82.5" class="grid"/><text x="56" y="86.5" class="mut small" text-anchor="end"><tspan x="56" dy="0">₹150</tspan></text><line x1="64" y1="20.0" x2="700" y2="20.0" class="grid"/><text x="56" y="24.0" class="mut small" text-anchor="end"><tspan x="56" dy="0">₹200</tspan></text><rect x="94.0" y="126.2" width="43.0" height="143.8" rx="3" fill="var(--c1)"/><text x="115.5" y="121.25" class="small b" text-anchor="middle"><tspan x="115.5" dy="0">₹115</tspan></text><text x="117.0" y="288" class="small" text-anchor="middle"><tspan x="117.0" dy="0">Platform revenue</tspan></text><rect x="200.0" y="182.5" width="43.0" height="87.5" rx="3" fill="var(--c1)"/><text x="221.5" y="177.5" class="small b" text-anchor="middle"><tspan x="221.5" dy="0">₹70</tspan></text><text x="223.0" y="288" class="small" text-anchor="middle"><tspan x="223.0" dy="0">Delivery cost</tspan></text><rect x="306.0" y="260.0" width="43.0" height="10.0" rx="3" fill="var(--c1)"/><text x="327.5" y="255.0" class="small b" text-anchor="middle"><tspan x="327.5" dy="0">₹8</tspan></text><text x="329.0" y="288" class="small" text-anchor="middle"><tspan x="329.0" dy="0">Payment fees</tspan></text><rect x="412.0" y="262.5" width="43.0" height="7.5" rx="3" fill="var(--c1)"/><text x="433.5" y="257.5" class="small b" text-anchor="middle"><tspan x="433.5" dy="0">₹6</tspan></text><text x="435.0" y="288" class="small" text-anchor="middle"><tspan x="435.0" dy="0">Support</tspan></text><rect x="518.0" y="251.2" width="43.0" height="18.8" rx="3" fill="var(--c1)"/><text x="539.5" y="246.25" class="small b" text-anchor="middle"><tspan x="539.5" dy="0">₹15</tspan></text><text x="541.0" y="288" class="small" text-anchor="middle"><tspan x="541.0" dy="0">Promotion</tspan></text><rect x="624.0" y="250.0" width="43.0" height="20.0" rx="3" fill="var(--c1)"/><text x="645.5" y="245.0" class="small b" text-anchor="middle"><tspan x="645.5" dy="0">₹16</tspan></text><text x="647.0" y="288" class="small" text-anchor="middle"><tspan x="647.0" dy="0">Contribution</tspan></text><line x1="64" y1="270" x2="700" y2="270" class="axis"/></svg>