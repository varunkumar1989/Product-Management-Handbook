<svg viewBox="0 0 720 256" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>From empty folder to a GitHub repository</title><defs><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><rect x="10.0" y="8" width="210.7" height="84" rx="10" class="node"/><rect x="10.0" y="8" width="7" height="84" rx="3" fill="var(--c6)"/><text x="26.0" y="24" class="tiny b" text-anchor="start" fill="var(--c6)" style="fill:var(--c6)">HUMAN</text><text x="26.0" y="41" class="small b" text-anchor="start"><tspan x="26.0" dy="0">Make a folder</tspan></text><text x="26.0" y="58" class="tiny mut" text-anchor="start"><tspan x="26.0" dy="0">mkdir split-bill &amp;&amp; cd split-bill</tspan></text><line x1="222.7" y1="50.0" x2="251.7" y2="50.0" class="edge" marker-end="url(#ahw)"/><rect x="254.7" y="8" width="210.7" height="84" rx="10" class="node"/><rect x="254.7" y="8" width="7" height="84" rx="3" fill="var(--c2)"/><text x="270.7" y="24" class="tiny b" text-anchor="start" fill="var(--c2)" style="fill:var(--c2)">AI STEP</text><text x="270.66666666666663" y="41" class="small b" text-anchor="start"><tspan x="270.66666666666663" dy="0">Ask Claude to build</tspan></text><text x="270.66666666666663" y="58" class="tiny mut" text-anchor="start"><tspan x="270.66666666666663" dy="0">&#x27;Create the landing page…&#x27;</tspan></text><line x1="467.3" y1="50.0" x2="496.3" y2="50.0" class="edge" marker-end="url(#ahw)"/><rect x="499.3" y="8" width="210.7" height="84" rx="10" class="node"/><rect x="499.3" y="8" width="7" height="84" rx="3" fill="var(--c1)"/><text x="515.3" y="24" class="tiny b" text-anchor="start" fill="var(--c1)" style="fill:var(--c1)">ACTION</text><text x="515.3333333333333" y="41" class="small b" text-anchor="start"><tspan x="515.3333333333333" dy="0">git init and first commit</tspan></text><text x="515.3333333333333" y="58" class="tiny mut" text-anchor="start"><tspan x="515.3333333333333" dy="0">&#x27;Initialise git and commit</tspan><tspan x="515.3333333333333" dy="11">everything&#x27;</tspan></text><line x1="604.7" y1="94" x2="604.7" y2="129" class="edge" marker-end="url(#ahw)"/><rect x="499.3" y="132" width="210.7" height="84" rx="10" class="node"/><rect x="499.3" y="132" width="7" height="84" rx="3" fill="var(--c1)"/><text x="515.3" y="148" class="tiny b" text-anchor="start" fill="var(--c1)" style="fill:var(--c1)">ACTION</text><text x="515.3333333333333" y="165" class="small b" text-anchor="start"><tspan x="515.3333333333333" dy="0">Create the GitHub repo</tspan></text><text x="515.3333333333333" y="182" class="tiny mut" text-anchor="start"><tspan x="515.3333333333333" dy="0">gh repo create split-bill --public</tspan><tspan x="515.3333333333333" dy="11">--source=. --push</tspan></text><line x1="497.3" y1="174.0" x2="468.3" y2="174.0" class="edge" marker-end="url(#ahw)"/><rect x="254.7" y="132" width="210.7" height="84" rx="10" class="node"/><rect x="254.7" y="132" width="7" height="84" rx="3" fill="var(--c5)"/><text x="270.7" y="148" class="tiny b" text-anchor="start" fill="var(--c5)" style="fill:var(--c5)">OUTPUT</text><text x="270.66666666666663" y="165" class="small b" text-anchor="start"><tspan x="270.66666666666663" dy="0">Repository on GitHub</tspan></text><text x="270.66666666666663" y="182" class="tiny mut" text-anchor="start"><tspan x="270.66666666666663" dy="0">github.com/you/split-bill</tspan></text><line x1="252.7" y1="174.0" x2="223.7" y2="174.0" class="edge" marker-end="url(#ahw)"/><rect x="10.0" y="132" width="210.7" height="84" rx="10" class="node"/><rect x="10.0" y="132" width="7" height="84" rx="3" fill="var(--c1)"/><text x="26.0" y="148" class="tiny b" text-anchor="start" fill="var(--c1)" style="fill:var(--c1)">ACTION</text><text x="26.0" y="165" class="small b" text-anchor="start"><tspan x="26.0" dy="0">Deploy</tspan></text><text x="26.0" y="182" class="tiny mut" text-anchor="start"><tspan x="26.0" dy="0">Netlify drop or netlify deploy</tspan></text></svg>