<svg viewBox="0 0 720 345" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>A good CLAUDE.md for a prototype project</title><rect x="6" y="6" width="708" height="201" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">CLAUDE.md</tspan></text><rect x="26" y="48" width="666" height="26" rx="5" class="wf-bar"/><text x="36" y="65" class="tiny b" text-anchor="start"><tspan x="36" dy="0"># Split Bill prototype</tspan></text><text x="30" y="93" class="tiny" text-anchor="start"><tspan x="30" dy="0">What this is: a mobile-first clickable prototype for a PM case study. Sample data only. Not production.</tspan></text><circle cx="694" cy="92" r="9" fill="var(--c3)"/><text x="694" y="96" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">1</tspan></text><text x="30" y="116" class="tiny" text-anchor="start"><tspan x="30" dy="0">Stack: plain HTML/CSS/JS, no build step. Deploy: Netlify from the /site folder.</tspan></text><circle cx="694" cy="115" r="9" fill="var(--c3)"/><text x="694" y="119" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">2</tspan></text><text x="30" y="139" class="tiny" text-anchor="start"><tspan x="30" dy="0">Rules: keep files small; no external trackers; label every page &#x27;Prototype · not affiliated with …&#x27;; never commit .env.</tspan></text><circle cx="694" cy="138" r="9" fill="var(--c3)"/><text x="694" y="142" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">3</tspan></text><text x="30" y="162" class="tiny" text-anchor="start"><tspan x="30" dy="0">Commands: open site/index.html to preview; run npx serve site for a local server.</tspan></text><circle cx="694" cy="161" r="9" fill="var(--c3)"/><text x="694" y="165" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">4</tspan></text><text x="30" y="185" class="tiny" text-anchor="start"><tspan x="30" dy="0">Before you finish: check the page at 375 px width and fix any horizontal scroll.</tspan></text><circle cx="694" cy="184" r="9" fill="var(--c3)"/><text x="694" y="188" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">5</tspan></text><circle cx="24" cy="225" r="9" fill="var(--c3)"/><text x="24" y="229" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="229" class="small" text-anchor="start"><tspan x="40" dy="0">One paragraph on what the project is and who it is for.</tspan></text><circle cx="24" cy="247" r="9" fill="var(--c3)"/><text x="24" y="251" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="251" class="small" text-anchor="start"><tspan x="40" dy="0">The stack and where things live.</tspan></text><circle cx="24" cy="269" r="9" fill="var(--c3)"/><text x="24" y="273" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="273" class="small" text-anchor="start"><tspan x="40" dy="0">Rules Claude must follow every time.</tspan></text><circle cx="24" cy="291" r="9" fill="var(--c3)"/><text x="24" y="295" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">4</tspan></text><text x="40" y="295" class="small" text-anchor="start"><tspan x="40" dy="0">How to run, preview and test.</tspan></text><circle cx="24" cy="313" r="9" fill="var(--c3)"/><text x="24" y="317" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">5</tspan></text><text x="40" y="317" class="small" text-anchor="start"><tspan x="40" dy="0">Your definition of done.</tspan></text></svg>