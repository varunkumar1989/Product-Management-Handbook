<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>MRR per variant after month-1 churn (synthetic pilot, 4,000 visitors each)</title><line x1="64" y1="270.0" x2="700" y2="270.0" class="grid"/><text x="56" y="274.0" class="mut small" text-anchor="end"><tspan x="56" dy="0">$0</tspan></text><line x1="64" y1="207.5" x2="700" y2="207.5" class="grid"/><text x="56" y="211.5" class="mut small" text-anchor="end"><tspan x="56" dy="0">$1,250</tspan></text><line x1="64" y1="145.0" x2="700" y2="145.0" class="grid"/><text x="56" y="149.0" class="mut small" text-anchor="end"><tspan x="56" dy="0">$2,500</tspan></text><line x1="64" y1="82.5" x2="700" y2="82.5" class="grid"/><text x="56" y="86.5" class="mut small" text-anchor="end"><tspan x="56" dy="0">$3,750</tspan></text><line x1="64" y1="20.0" x2="700" y2="20.0" class="grid"/><text x="56" y="24.0" class="mut small" text-anchor="end"><tspan x="56" dy="0">$5,000</tspan></text><rect x="147.0" y="160.4" width="43.0" height="109.6" rx="3" fill="var(--c1)"/><text x="168.5" y="155.4" class="small b" text-anchor="middle"><tspan x="168.5" dy="0">$2,192</tspan></text><text x="170.0" y="288" class="small" text-anchor="middle"><tspan x="170.0" dy="0">A · $6</tspan></text><rect x="359.0" y="120.9" width="43.0" height="149.1" rx="3" fill="var(--c1)"/><text x="380.5" y="115.94999999999999" class="small b" text-anchor="middle"><tspan x="380.5" dy="0">$2,981</tspan></text><text x="382.0" y="288" class="small" text-anchor="middle"><tspan x="382.0" dy="0">B · $9</tspan></text><rect x="571.0" y="123.1" width="43.0" height="146.9" rx="3" fill="var(--c1)"/><text x="592.5" y="118.1" class="small b" text-anchor="middle"><tspan x="592.5" dy="0">$2,938</tspan></text><text x="594.0" y="288" class="small" text-anchor="middle"><tspan x="594.0" dy="0">C · $12</tspan></text><line x1="64" y1="270" x2="700" y2="270" class="axis"/></svg>