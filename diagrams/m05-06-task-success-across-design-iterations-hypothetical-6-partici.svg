<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Task success across design iterations (hypothetical, 6 participants per round)</title><line x1="64" y1="268.0" x2="696" y2="268.0" class="grid"/><text x="56" y="272.0" class="mut small" text-anchor="end"><tspan x="56" dy="0">0%</tspan></text><line x1="64" y1="206.0" x2="696" y2="206.0" class="grid"/><text x="56" y="210.0" class="mut small" text-anchor="end"><tspan x="56" dy="0">25%</tspan></text><line x1="64" y1="144.0" x2="696" y2="144.0" class="grid"/><text x="56" y="148.0" class="mut small" text-anchor="end"><tspan x="56" dy="0">50%</tspan></text><line x1="64" y1="82.0" x2="696" y2="82.0" class="grid"/><text x="56" y="86.0" class="mut small" text-anchor="end"><tspan x="56" dy="0">75%</tspan></text><line x1="64" y1="20.0" x2="696" y2="20.0" class="grid"/><text x="56" y="24.0" class="mut small" text-anchor="end"><tspan x="56" dy="0">100%</tspan></text><text x="64.0" y="286" class="small" text-anchor="middle"><tspan x="64.0" dy="0">Round 1 (baseline)</tspan></text><text x="380.0" y="286" class="small" text-anchor="middle"><tspan x="380.0" dy="0">Round 2 (fee in cart)</tspan></text><text x="696.0" y="286" class="small" text-anchor="middle"><tspan x="696.0" dy="0">Round 3 (+ labels)</tspan></text><polyline points="64.0,144.0 380.0,62.2 696.0,20.0" fill="none" stroke="var(--c1)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="64.0" cy="144.0" r="3.5" fill="var(--c1)"/><circle cx="380.0" cy="62.2" r="3.5" fill="var(--c1)"/><circle cx="696.0" cy="20.0" r="3.5" fill="var(--c1)"/><text x="64.0" y="135.0" class="small b" text-anchor="middle"><tspan x="64.0" dy="0">50%</tspan></text><text x="380.0" y="53.16" class="small b" text-anchor="middle"><tspan x="380.0" dy="0">83%</tspan></text><text x="696.0" y="11.0" class="small b" text-anchor="middle"><tspan x="696.0" dy="0">100%</tspan></text><line x1="64" y1="268" x2="696" y2="268" class="axis"/><text x="14" y="144.0" class="mut small" text-anchor="middle" transform="rotate(-90 14 144.0)">% of participants</text></svg>