<svg viewBox="0 0 690 416" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>The customer&#x27;s view</title><rect x="10" y="26" width="190" height="360" rx="22" class="phone"/><text x="105.0" y="16" class="small b" text-anchor="middle"><tspan x="105.0" dy="0">Reschedule</tspan></text><rect x="22" y="52" width="166" height="26" rx="5" class="wf-bar"/><text x="105.0" y="69" class="tiny b" text-anchor="middle"><tspan x="105.0" dy="0">Sunrise Physio</tspan></text><text x="26" y="98" class="tiny" text-anchor="start"><tspan x="26" dy="0">You: Can I move my appointment</tspan><tspan x="26" dy="11">to Friday?</tspan></text><text x="26" y="131" class="tiny" text-anchor="start"><tspan x="26" dy="0">Bot: I found your booking for</tspan><tspan x="26" dy="11">Wed 23 Oct, 10:00. Friday has</tspan><tspan x="26" dy="11">11:00 or 16:30. Which works?</tspan></text><rect x="22" y="163" width="166" height="32" rx="8" fill="var(--c1)"/><text x="105.0" y="184" class="tiny b on-fill" text-anchor="middle"><tspan x="105.0" dy="0">11:00</tspan></text><rect x="22" y="205" width="166" height="32" rx="8" fill="var(--c1)"/><text x="105.0" y="226" class="tiny b on-fill" text-anchor="middle"><tspan x="105.0" dy="0">16:30</tspan></text><circle cx="214" cy="60" r="10" fill="var(--c3)"/><text x="214" y="64" class="tiny b on-fill" text-anchor="middle"><tspan x="214" dy="0">1</tspan></text><text x="230" y="64" class="tiny" text-anchor="start"><tspan x="230" dy="0">Bot finds the</tspan><tspan x="230" dy="11">booking with a tool</tspan></text><circle cx="214" cy="122" r="10" fill="var(--c3)"/><text x="214" y="126" class="tiny b on-fill" text-anchor="middle"><tspan x="214" dy="0">2</tspan></text><text x="230" y="126" class="tiny" text-anchor="start"><tspan x="230" dy="0">Quick-reply buttons</tspan><tspan x="230" dy="11">reduce typing</tspan></text><rect x="350" y="26" width="190" height="360" rx="22" class="phone"/><text x="445.0" y="16" class="small b" text-anchor="middle"><tspan x="445.0" dy="0">Handoff</tspan></text><rect x="362" y="52" width="166" height="26" rx="5" class="wf-bar"/><text x="445.0" y="69" class="tiny b" text-anchor="middle"><tspan x="445.0" dy="0">Sunrise Physio</tspan></text><text x="366" y="98" class="tiny" text-anchor="start"><tspan x="366" dy="0">You: My knee is much worse after</tspan><tspan x="366" dy="11">the session.</tspan></text><rect x="362" y="119" width="166" height="32" rx="6" class="wf-warn"/><text x="445.0" y="139" class="tiny b" text-anchor="middle"><tspan x="445.0" dy="0">Connecting you to our team</tspan></text><text x="366" y="171" class="tiny" text-anchor="start"><tspan x="366" dy="0">Bot: I&#x27;m sorry to hear that. A</tspan><tspan x="366" dy="11">physiotherapist will reply here</tspan><tspan x="366" dy="11">within 30 minutes. If it&#x27;s an</tspan><tspan x="366" dy="11">emergency, call 112.</tspan></text><circle cx="554" cy="60" r="10" fill="var(--c3)"/><text x="554" y="64" class="tiny b on-fill" text-anchor="middle"><tspan x="554" dy="0">1</tspan></text><text x="570" y="64" class="tiny" text-anchor="start"><tspan x="570" dy="0">Health concerns</tspan><tspan x="570" dy="11">always go to a</tspan><tspan x="570" dy="11">person</tspan></text><circle cx="554" cy="122" r="10" fill="var(--c3)"/><text x="554" y="126" class="tiny b on-fill" text-anchor="middle"><tspan x="554" dy="0">2</tspan></text><text x="570" y="126" class="tiny" text-anchor="start"><tspan x="570" dy="0">Say what happens</tspan><tspan x="570" dy="11">next and when</tspan></text></svg>