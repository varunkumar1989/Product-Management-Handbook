<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Habit loop for daily learning</title><defs><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><path d="M418.2,81.4 Q499.4,111.2 540.2,146.7" class="edge" fill="none" marker-end="url(#ah3)"/><path d="M543.2,230.7 Q499.4,268.8 421.9,297.2" class="edge" fill="none" marker-end="url(#ah3)"/><path d="M301.8,298.6 Q220.6,268.8 179.8,233.3" class="edge" fill="none" marker-end="url(#ah3)"/><path d="M176.8,149.3 Q220.6,111.2 298.1,82.8" class="edge" fill="none" marker-end="url(#ah3)"/><rect x="285.0" y="37.0" width="150" height="46" rx="10" class="node"/><text x="360.0" y="58.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">Cue: daily reminder at</tspan><tspan x="360.0" dy="12">chosen time</tspan></text><rect x="515.0" y="167.0" width="150" height="46" rx="10" class="node"/><text x="590.0" y="188.0" class="small b" text-anchor="middle"><tspan x="590.0" dy="0">Routine: 5-minute</tspan><tspan x="590.0" dy="12">lesson</tspan></text><rect x="285.0" y="297.0" width="150" height="46" rx="10" class="node"/><text x="360.0" y="318.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">Reward: progress,</tspan><tspan x="360.0" dy="12">streak, XP</tspan></text><rect x="55.0" y="167.0" width="150" height="46" rx="10" class="node"/><text x="130.0" y="188.00000000000003" class="small b" text-anchor="middle"><tspan x="130.0" dy="0">Investment: streak &amp;</tspan><tspan x="130.0" dy="12">goals worth protecting</tspan></text><circle cx="360.0" cy="190.0" r="46" fill="var(--c2)" fill-opacity=".15" stroke="var(--c2)" stroke-width="2"/><text x="360.0" y="194.0" class="small b" text-anchor="middle"><tspan x="360.0" dy="0">Habit loop</tspan></text></svg>