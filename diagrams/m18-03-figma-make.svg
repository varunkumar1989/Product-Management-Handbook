<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Figma Make</title><rect x="6" y="6" width="708" height="200" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">Figma Make</tspan></text><rect x="12" y="38" width="150" height="162" rx="8" class="wf-bar" fill-opacity=".6"/><rect x="516" y="38" width="190" height="162" rx="8" class="wf-bar" fill-opacity=".45"/><text x="28" y="49" class="tiny" text-anchor="start"><tspan x="28" dy="0">Prompt</tspan></text><circle cx="146" cy="45" r="9" fill="var(--c3)"/><text x="146" y="49" class="tiny b on-fill" text-anchor="middle"><tspan x="146" dy="0">1</tspan></text><text x="28" y="73" class="tiny" text-anchor="start"><tspan x="28" dy="0">Attach frames</tspan></text><text x="28" y="97" class="tiny" text-anchor="start"><tspan x="28" dy="0">Versions</tspan></text><text x="28" y="121" class="tiny" text-anchor="start"><tspan x="28" dy="0">Publish</tspan></text><rect x="232.5" y="48" width="257.5" height="45" rx="9" fill="var(--c1)" fill-opacity=".14" stroke="var(--c1)"/><text x="240.52000000000004" y="63" class="tiny" text-anchor="start"><tspan x="240.52000000000004" dy="0">Turn the attached three Split Bill frames</tspan><tspan x="240.52000000000004" dy="11">into a working prototype. Totals must</tspan><tspan x="240.52000000000004" dy="11">recalculate when I add a friend. Sample data.</tspan></text><rect x="176.0" y="101" width="257.5" height="45" rx="9" class="wf-bar"/><text x="184" y="116" class="tiny" text-anchor="start"><tspan x="184" dy="0">Building… The prototype uses your frames&#x27;</tspan><tspan x="184" dy="11">layout and colours. Try adding a friend in</tspan><tspan x="184" dy="11">the preview.</tspan></text><circle cx="492" cy="111" r="9" fill="var(--c3)"/><text x="492" y="115" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">2</tspan></text><rect x="232.5" y="154" width="257.5" height="34" rx="9" fill="var(--c1)" fill-opacity=".14" stroke="var(--c1)"/><text x="240.52000000000004" y="169" class="tiny" text-anchor="start"><tspan x="240.52000000000004" dy="0">Add an error state when a split doesn&#x27;t add</tspan><tspan x="240.52000000000004" dy="11">up to the bill total.</tspan></text><circle cx="492" cy="164" r="9" fill="var(--c3)"/><text x="492" y="168" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">3</tspan></text><rect x="524.0" y="48" width="83.0" height="22" rx="5" fill="var(--c1)"/><text x="565.5" y="63" class="tiny b on-fill" text-anchor="middle"><tspan x="565.5" dy="0">Preview</tspan></text><rect x="611.0" y="48" width="83.0" height="22" rx="5" class="wf-bar"/><text x="652.5" y="63" class="tiny" text-anchor="middle"><tspan x="652.5" dy="0">Code</tspan></text><rect x="524" y="78" width="174" height="56" rx="6" class="wf-img"/><text x="611.0" y="110" class="tiny mut" text-anchor="middle"><tspan x="611.0" dy="0">Working prototype</tspan></text><rect x="524" y="142" width="94" height="28" rx="7" fill="var(--c1)"/><text x="571.0" y="160" class="tiny b on-fill" text-anchor="middle"><tspan x="571.0" dy="0">Share link</tspan></text><circle cx="24" cy="224" r="9" fill="var(--c3)"/><text x="24" y="228" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="228" class="small" text-anchor="start"><tspan x="40" dy="0">Start from a prompt, or attach existing frames so the result matches your design.</tspan></text><circle cx="24" cy="246" r="9" fill="var(--c3)"/><text x="24" y="250" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="250" class="small" text-anchor="start"><tspan x="40" dy="0">Make writes real code. Test interactions in the preview.</tspan></text><circle cx="24" cy="268" r="9" fill="var(--c3)"/><text x="24" y="272" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="272" class="small" text-anchor="start"><tspan x="40" dy="0">Ask for edge cases and states, one per message.</tspan></text></svg>