t x="688" y="126" class="tiny b" text-anchor="end"><tspan x="688" dy="0">Connected ✓</tspan></text><line x1="176" y1="162" x2="692" y2="162" class="grid"/><text x="180" y="154" class="tiny" text-anchor="start"><tspan x="180" dy="0">Google Drive</tspan></text><text x="688" y="154" class="tiny b" text-anchor="end"><tspan x="688" dy="0">Connected ✓</tspan></text><line x1="176" y1="190" x2="692" y2="190" class="grid"/><text x="180" y="182" class="tiny" text-anchor="start"><tspan x="180" dy="0">Slack</tspan></text><text x="688" y="182" class="tiny b" text-anchor="end"><tspan x="688" dy="0">Connect</tspan></text><line x1="176" y1="218" x2="692" y2="218" class="grid"/><text x="180" y="210" class="tiny" text-anchor="start"><tspan x="180" dy="0">GitHub</tspan></text><text x="688" y="210" class="tiny b" text-anchor="end"><tspan x="688" dy="0">Connect</tspan></text><line x1="176" y1="246" x2="692" y2="246" class="grid"/><text x="180" y="238" class="tiny" text-anchor="start"><tspan x="180" dy="0">Notion · Figma · others</tspan></text><text x="688" y="238" class="tiny b" text-anchor="end"><tspan x="688" dy="0">Browse</tspan></text><rect x="176" y="250" width="164" height="28" rx="7" fill="var(--c1)"/><text x="258.0" y="268" class="tiny b on-fill" text-anchor="middle"><tspan x="258.0" dy="0">Add custom connector</tspan></text><circle cx="694" cy="260" r="9" fill="var(--c3)"/><text x="694" y="264" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">2</tspan></text><circle cx="24" cy="314" r="9" fill="var(--c3)"/><text x="24" y="318" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="318" class="small" text-anchor="start"><tspan x="40" dy="0">Click Connect, sign in to the other app and approve. On Team and Enterprise plans an admin may need to</tspan><tspan x="40" dy="14">enable a connector first.</tspan></text><circle cx="24" cy="350" r="9" fill="var(--c3)"/><text x="24" y="354" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="354" class="small" text-anchor="start"><tspan x="40" dy="0">Custom connector: paste the URL of a remote MCP server (for example your own n8n workflow, Class 20) to</tspan><tspan x="40" dy="14">give Claude new tools.</tspan></text></svg>