hor="start"><tspan x="570" dy="0">28.2% drop-off</tspan></text><text x="158" y="254.0" class="b small" text-anchor="end"><tspan x="158" dy="0">Active in week 4</tspan></text><rect x="353.45" y="226" width="93.1" height="46" rx="6" fill="var(--c2)" opacity="0.76"/><text x="400" y="254.0" class="on-fill b" text-anchor="middle"><tspan x="400" dy="0">24,500</tspan></text><text x="570" y="247.0" class="mut small" text-anchor="start"><tspan x="570" dy="0">87.5% of previous</tspan></text><text x="570" y="262.0" class="warn small" text-anchor="start"><tspan x="570" dy="0">12.5% drop-off</tspan></text></svg>