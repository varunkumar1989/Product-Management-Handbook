<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Where AI coding tool categories sit (conceptual)</title><rect x="70" y="20" width="630" height="324" class="plot"/><line x1="385.0" y1="20" x2="385.0" y2="344" class="grid dash"/><line x1="70" y1="182.0" x2="700" y2="182.0" class="grid dash"/><text x="78" y="36" class="quad" text-anchor="start"><tspan x="78" dy="0">Fast prototypes, less control</tspan></text><text x="692" y="36" class="quad" text-anchor="end"><tspan x="692" dy="0">Fast and controllable</tspan></text><text x="78" y="336" class="quad" text-anchor="start"><tspan x="78" dy="0">Slow, low control</tspan></text><text x="692" y="336" class="quad" text-anchor="end"><tspan x="692" dy="0">Controlled, needs skills</tspan></text><circle cx="183.4" cy="68.6" r="9" fill="var(--c1)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"/><text x="196.4" y="72.60000000000002" class="small" text-anchor="start"><tspan x="196.4" dy="0">General assistants</tspan></text><circle cx="290.5" cy="52.4" r="9" fill="var(--c1)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"/><text x="303.5" y="56.39999999999998" class="small" text-anchor="start"><tspan x="303.5" dy="0">Browser app builders</tspan></text><circle cx="511.0" cy="149.6" r="9" fill="var(--c2)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"/><text x="524.0" y="153.6" class="small" text-anchor="start"><tspan x="524.0" dy="0">AI code editors (IDEs)</tspan></text><circle cx="605.5" cy="133.4" r="9" fill="var(--c2)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"/><text x="592.5" y="137.4" class="small" text-anchor="end"><tspan x="592.5" dy="0">Terminal / agentic tools</tspan></text><circle cx="574.0" cy="246.8" r="9" fill="var(--c2)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"/><text x="561.0" y="250.8" class="small" text-anchor="end"><tspan x="561.0" dy="0">Inline completion</tspan></text><line x1="70" y1="344" x2="700" y2="344" class="axis"/><line x1="70" y1="20" x2="70" y2="344" class="axis"/><text x="385.0" y="388" class="small b mut" text-anchor="middle"><tspan x="385.0" dy="0">Control over code, environment and review (1–10)</tspan></text><text x="16" y="182.0" class="small b mut" text-anchor="middle" transform="rotate(-90 16 182.0)">Speed from idea to something clickable (1–10)</text><circle cx="75" cy="370" r="5" fill="var(--c1)"/><text x="84" y="374" class="small" text-anchor="start"><tspan x="84" dy="0">Low setup</tspan></text><circle cx="163.5" cy="370" r="5" fill="var(--c2)"/><text x="172.5" y="374" class="small" text-anchor="start"><tspan x="172.5" dy="0">Needs a dev environment</tspan></text></svg>