"1.5"/><text x="524.0" y="153.6" class="small" text-anchor="start"><tspan x="524.0" dy="0">Users want recipes</tspan></text><line x1="70" y1="344" x2="700" y2="344" class="axis"/><line x1="70" y1="20" x2="70" y2="344" class="axis"/><text x="385.0" y="388" class="small b mut" text-anchor="middle"><tspan x="385.0" dy="0">Evidence we have (1 = none, 10 = strong)</tspan></text><text x="16" y="182.0" class="small b mut" text-anchor="middle" transform="rotate(-90 16 182.0)">Importance if wrong (1–10)</text></svg>