<svg viewBox="0 0 720 354" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Adding MCP servers</title><rect x="6" y="6" width="708" height="226" rx="12" class="phone"/><line x1="6" y1="34" x2="714" y2="34" class="grid"/><circle cx="22" cy="20" r="4.5" fill="var(--c5)"/><circle cx="36" cy="20" r="4.5" fill="var(--c3)"/><circle cx="50" cy="20" r="4.5" fill="var(--c4)"/><text x="76" y="24" class="small b" text-anchor="start"><tspan x="76" dy="0">Terminal</tspan></text><rect x="26" y="48" width="666" height="24" rx="6" fill="var(--ink)" fill-opacity=".9"/><text x="34" y="64" class="tiny on-fill" text-anchor="start" style="font-family:ui-monospace,Consolas,monospace">$ claude mcp add --transport http notion https://mcp.notion.com/mcp</text><circle cx="694" cy="58" r="9" fill="var(--c3)"/><text x="694" y="62" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">1</tspan></text><rect x="26" y="80" width="666" height="24" rx="6" fill="var(--ink)" fill-opacity=".9"/><text x="34" y="96" class="tiny on-fill" text-anchor="start" style="font-family:ui-monospace,Consolas,monospace">$ claude mcp add playwright -- npx @playwright/mcp@latest</text><circle cx="694" cy="90" r="9" fill="var(--c3)"/><text x="694" y="94" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">2</tspan></text><rect x="26" y="112" width="666" height="24" rx="6" fill="var(--ink)" fill-opacity=".9"/><text x="34" y="128" class="tiny on-fill" text-anchor="start" style="font-family:ui-monospace,Consolas,monospace">$ claude mcp list</text><rect x="26" y="144" width="666" height="28" rx="6" fill="var(--c4)" fill-opacity=".14" stroke="var(--c4)"/><text x="36" y="162" class="tiny b" text-anchor="start"><tspan x="36" dy="0">notion: connected · playwright: connected</tspan></text><rect x="145.9" y="180" width="546.1" height="34" rx="9" fill="var(--c1)" fill-opacity=".14" stroke="var(--c1)"/><text x="153.88" y="195" class="tiny" text-anchor="start"><tspan x="153.88" dy="0">Read the &#x27;Split Bill&#x27; PRD in Notion, then open the local site with Playwright and list any</tspan><tspan x="153.88" dy="11">requirement the page doesn&#x27;t meet.</tspan></text><circle cx="694" cy="190" r="9" fill="var(--c3)"/><text x="694" y="194" class="tiny b on-fill" text-anchor="middle"><tspan x="694" dy="0">3</tspan></text><circle cx="24" cy="250" r="9" fill="var(--c3)"/><text x="24" y="254" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="254" class="small" text-anchor="start"><tspan x="40" dy="0">Remote servers: --transport http plus the service&#x27;s MCP URL. The first use opens a browser to sign in.</tspan><tspan x="40" dy="14">Check each vendor&#x27;s docs for the current URL.</tspan></text><circle cx="24" cy="286" r="9" fill="var(--c3)"/><text x="24" y="290" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="290" class="small" text-anchor="start"><tspan x="40" dy="0">Local servers run a command on your machine. Playwright lets Claude open and click through web pages to</tspan><tspan x="40" dy="14">test them.</tspan></text><circle cx="24" cy="322" r="9" fill="var(--c3)"/><text x="24" y="326" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="326" class="small" text-anchor="start"><tspan x="40" dy="0">Combine tools in one request: read the spec, test the page, report gaps.</tspan></text></svg>