nd"><tspan x="529.5" dy="0">Support</tspan></text><circle cx="448.0" cy="230.6" r="9" fill="var(--c1)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"/><text x="461.0" y="234.6" class="small" text-anchor="start"><tspan x="461.0" dy="0">Marketing</tspan></text><line x1="70" y1="344" x2="700" y2="344" class="axis"/><line x1="70" y1="20" x2="70" y2="344" class="axis"/><text x="385.0" y="388" class="small b mut" text-anchor="middle"><tspan x="385.0" dy="0">Interest (1–10)</tspan></text><text x="16" y="182.0" class="small b mut" text-anchor="middle" transform="rotate(-90 16 182.0)">Power (1–10)</text></svg>