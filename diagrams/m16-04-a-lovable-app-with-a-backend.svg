e"><tspan x="216.0" dy="0">Claude API</tspan></text><rect x="321.0" y="360" width="170.0" height="58" rx="8" class="node"/><text x="406.0" y="393.0" class="small b" text-anchor="middle"><tspan x="406.0" dy="0">Stripe payments</tspan></text><rect x="511.0" y="360" width="170.0" height="58" rx="8" class="node"/><text x="596.0" y="393.0" class="small b" text-anchor="middle"><tspan x="596.0" dy="0">Email service</tspan></text><path d="M406.0,88.0 C406.0,112.5 216.0,112.5 216.0,137.0" class="edge" fill="none" marker-end="url(#ah2)"/><path d="M406.0,88.0 C406.0,112.5 406.0,112.5 406.0,137.0" class="edge" fill="none" marker-end="url(#ah2)"/><path d="M406.0,88.0 C406.0,167.5 311.0,167.5 311.0,247.0" class="edge" fill="none" marker-end="url(#ah2)"/><path d="M311.0,308.0 C311.0,332.5 216.0,332.5 216.0,357.0" class="edge" fill="none" marker-end="url(#ah2)"/><path d="M311.0,308.0 C311.0,332.5 406.0,332.5 406.0,357.0" class="edge" fill="none" marker-end="url(#ah2)"/><line x1="416.0" y1="279.0" x2="399.0" y2="279.0" class="edge" marker-end="url(#ah2)"/></svg>