x="486" y="149" class="tiny b" text-anchor="end"><tspan x="486" dy="0">Yesterday</tspan></text><rect x="176" y="161" width="314" height="28" rx="6" class="wf-input"/><text x="186" y="179" class="tiny mut" text-anchor="start"><tspan x="186" dy="0">Start a chat in this project…</tspan></text><circle cx="492" cy="171" r="9" fill="var(--c3)"/><text x="492" y="175" class="tiny b on-fill" text-anchor="middle"><tspan x="492" dy="0">3</tspan></text><rect x="524" y="48" width="174" height="26" rx="5" class="wf-bar"/><text x="534" y="65" class="tiny b" text-anchor="start"><tspan x="534" dy="0">Instructions</tspan></text><circle cx="700" cy="58" r="9" fill="var(--c3)"/><text x="700" y="62" class="tiny b on-fill" text-anchor="middle"><tspan x="700" dy="0">1</tspan></text><text x="528" y="93" class="tiny" text-anchor="start"><tspan x="528" dy="0">You are my PM co-pilot for</tspan><tspan x="528" dy="11">FoodApp checkout. Users: urban</tspan><tspan x="528" dy="11">22–35. Always flag assumptions.</tspan><tspan x="528" dy="11">Use British spelling.</tspan></text><rect x="524" y="138" width="174" height="26" rx="5" class="wf-bar"/><text x="534" y="155" class="tiny b" text-anchor="start"><tspan x="534" dy="0">Knowledge</tspan></text><circle cx="700" cy="148" r="9" fill="var(--c3)"/><text x="700" y="152" class="tiny b on-fill" text-anchor="middle"><tspan x="700" dy="0">2</tspan></text><line x1="524" y1="196" x2="698" y2="196" class="grid"/><text x="528" y="188" class="tiny" text-anchor="start"><tspan x="528" dy="0">strategy-2026.pdf</tspan></text><text x="694" y="188" class="tiny b" text-anchor="end"><tspan x="694" dy="0">PDF</tspan></text><line x1="524" y1="224" x2="698" y2="224" class="grid"/><text x="528" y="216" class="tiny" text-anchor="start"><tspan x="528" dy="0">personas.md</tspan></text><text x="694" y="216" class="tiny b" text-anchor="end"><tspan x="694" dy="0">Doc</tspan></text><line x1="524" y1="252" x2="698" y2="252" class="grid"/><text x="528" y="244" class="tiny" text-anchor="start"><tspan x="528" dy="0">checkout-funnel.csv</tspan></text><text x="694" y="244" class="tiny b" text-anchor="end"><tspan x="694" dy="0">CSV</tspan></text><circle cx="24" cy="284" r="9" fill="var(--c3)"/><text x="24" y="288" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">1</tspan></text><text x="40" y="288" class="small" text-anchor="start"><tspan x="40" dy="0">Instructions: who Claude is in this project, your users, rules (tone, spelling, &#x27;always cite the source</tspan><tspan x="40" dy="14">file&#x27;).</tspan></text><circle cx="24" cy="320" r="9" fill="var(--c3)"/><text x="24" y="324" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">2</tspan></text><text x="40" y="324" class="small" text-anchor="start"><tspan x="40" dy="0">Knowledge: upload the strategy, personas, PRDs, research and metrics. Keep files current; delete stale</tspan><tspan x="40" dy="14">ones.</tspan></text><circle cx="24" cy="356" r="9" fill="var(--c3)"/><text x="24" y="360" class="tiny b on-fill" text-anchor="middle"><tspan x="24" dy="0">3</tspan></text><text x="40" y="360" class="small" text-anchor="start"><tspan x="40" dy="0">Every chat started here sees the instructions and knowledge, so you never paste context again.</tspan></text></svg>