<svg viewBox="0 0 720 174" xmlns="http://www.w3.org/2000/svg"><style>
svg{--ink:#101828;--muted:#475467;--line:#D0D5DD;--grid:#E4E7EC;--bg2:#F8FAFC;--surface:#fff;--ink2:#344054;--warn:#B54708;--warn-bg:#FFFAEB;
--c1:#2563EB;--c2:#7C3AED;--c3:#D97706;--c4:#059669;--c5:#DB2777;--c6:#64748B;font-family:'Segoe UI',Arial,sans-serif;background:#fff}
text{fill:var(--ink);font-size:12.5px}text.small{font-size:11.5px}text.tiny{font-size:10.5px}text.b{font-weight:700}text.mut{fill:var(--muted)}
text.warn{fill:var(--warn)}text.on-fill{fill:#fff}text.quad{fill:var(--muted);font-size:11px;font-style:italic}
.grid{stroke:var(--grid)}.grid.dash{stroke-dasharray:4 4}.axis{stroke:var(--muted);stroke-width:1.2}.plot{fill:var(--bg2);stroke:var(--line)}
.node{fill:var(--bg2);stroke:var(--line);stroke-width:1.5}.node.hl{fill:#E8EFFE;stroke:var(--c1)}.edge{stroke:var(--muted);stroke-width:1.6;fill:none}
.arrowhead{fill:var(--muted)}.reject{fill:var(--c3);fill-opacity:.4}.empty{fill:var(--bg2);stroke:var(--line);stroke-dasharray:3 3}
.phone{fill:#fff;stroke:var(--ink2);stroke-width:2.2}.wf-bar{fill:var(--bg2);stroke:var(--line)}.wf-img{fill:var(--bg2);stroke:var(--line);stroke-dasharray:4 3}
.wf-input{fill:#fff;stroke:var(--muted)}.wf-warn{fill:var(--warn-bg);stroke:var(--c3)}
</style><title>Lab 5 · A tool Claude can call</title><defs><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><rect x="10.0" y="8" width="112.8" height="126" rx="10" class="node"/><rect x="10.0" y="8" width="7" height="126" rx="3" fill="var(--c4)"/><text x="26.0" y="24" class="tiny b" text-anchor="start" fill="var(--c4)" style="fill:var(--c4)">TRIGGER</text><text x="26.0" y="41" class="small b" text-anchor="start"><tspan x="26.0" dy="0">MCP Server</tspan><tspan x="26.0" dy="13">Trigger</tspan></text><text x="26.0" y="71" class="tiny mut" text-anchor="start"><tspan x="26.0" dy="0">Gives Claude a</tspan><tspan x="26.0" dy="11">URL that lists</tspan><tspan x="26.0" dy="11">and runs the</tspan><tspan x="26.0" dy="11">tools attached</tspan><tspan x="26.0" dy="11">below</tspan></text><line x1="124.8" y1="71.0" x2="153.8" y2="71.0" class="edge" marker-end="url(#ahw)"/><rect x="156.8" y="8" width="112.8" height="126" rx="10" class="node"/><rect x="156.8" y="8" width="7" height="126" rx="3" fill="var(--c1)"/><text x="172.8" y="24" class="tiny b" text-anchor="start" fill="var(--c1)" style="fill:var(--c1)">ACTION</text><text x="172.8" y="41" class="small b" text-anchor="start"><tspan x="172.8" dy="0">Tool: Custom</tspan><tspan x="172.8" dy="13">n8n Workflow</tspan><tspan x="172.8" dy="13">Tool</tspan></text><text x="172.8" y="84" class="tiny mut" text-anchor="start"><tspan x="172.8" dy="0">Name log_bug;</tspan><tspan x="172.8" dy="11">inputs title,</tspan><tspan x="172.8" dy="11">severity</tspan></text><line x1="271.6" y1="71.0" x2="300.6" y2="71.0" class="edge" marker-end="url(#ahw)"/><rect x="303.6" y="8" width="112.8" height="126" rx="10" class="node"/><rect x="303.6" y="8" width="7" height="126" rx="3" fill="var(--c4)"/><text x="319.6" y="24" class="tiny b" text-anchor="start" fill="var(--c4)" style="fill:var(--c4)">TRIGGER</text><text x="319.6" y="41" class="small b" text-anchor="start"><tspan x="319.6" dy="0">Sub-workflow</tspan><tspan x="319.6" dy="13">starts</tspan></text><text x="319.6" y="71" class="tiny mut" text-anchor="start"><tspan x="319.6" dy="0">Execute Workflow</tspan><tspan x="319.6" dy="11">Trigger receives</tspan><tspan x="319.6" dy="11">title, severity</tspan></text><line x1="418.4" y1="71.0" x2="447.4" y2="71.0" class="edge" marker-end="url(#ahw)"/><rect x="450.4" y="8" width="112.8" height="126" rx="10" class="node"/><rect x="450.4" y="8" width="7" height="126" rx="3" fill="var(--c1)"/><text x="466.4" y="24" class="tiny b" text-anchor="start" fill="var(--c1)" style="fill:var(--c1)">ACTION</text><text x="466.40000000000003" y="41" class="small b" text-anchor="start"><tspan x="466.40000000000003" dy="0">Google</tspan><tspan x="466.40000000000003" dy="13">Sheets:</tspan><tspan x="466.40000000000003" dy="13">append row</tspan></text><text x="466.40000000000003" y="84" class="tiny mut" text-anchor="start"><tspan x="466.40000000000003" dy="0">Bugs sheet</tspan></text><line x1="565.2" y1="71.0" x2="594.2" y2="71.0" class="edge" marker-end="url(#ahw)"/><rect x="597.2" y="8" width="112.8" height="126" rx="10" class="node"/><rect x="597.2" y="8" width="7" height="126" rx="3" fill="var(--c5)"/><text x="613.2" y="24" class="tiny b" text-anchor="start" fill="var(--c5)" style="fill:var(--c5)">OUTPUT</text><text x="613.2" y="41" class="small b" text-anchor="start"><tspan x="613.2" dy="0">Slack: notify</tspan><tspan x="613.2" dy="13">#practice-bugs</tspan></text><text x="613.2" y="71" class="tiny mut" text-anchor="start"><tspan x="613.2" dy="0">Title and</tspan><tspan x="613.2" dy="11">severity</tspan></text></svg>